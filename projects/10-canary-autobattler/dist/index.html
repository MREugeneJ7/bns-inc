first_ed_later:["MAGOMANIACO: Aqui sigo junto al fogon. Hablame cuando decidas si prefieres el Burgado o el Cangrejo!"],first_ed_received:t=>[`Recibes ${t}! Guardada en el PC de Ayoze.`,"AVISO: 1ª edicion descatalogada. Cuando abras el Centro Certificador de La Gomera podras legalizarla y jugarla."],olsen_sail_on_exit:["BOOOOOOM!! Nada mas pisar el pantalan tras rascarle la espalda al Capitan, el S.S. OLSEN recoge pasarela y sale disparado a 38 nudos!","El fast-ferry se pierde en el horizonte dejando olor a gasoil y aire acondicionado polar. Cuando termines en Galdar, tocara volver en CAYUCO."],olsen_gone:["El atraque esta vacio: el S.S. Olsen zarpo en cuanto le rascaste el lomo al Capitan y saliste.","Pa volver a BENIJO (Tenerife) habla con CARMELO en el pantalan del oeste."],m_o_granted:['UN MECANICO DE ANAGA baja corriendo al verte desembarcar: "Chacho, tu eres el que tumbo las Cuevas Pintadas?! Toma, regalo del taller!"',"Recibes el M.O. 1 · TODO TERRENO! Ya esta guardado en tu 🎒 MOCHILA (en el menú START).","MECANICO: Sube 3 pasos al SUR hasta pisar el ASFALTO de la carretera, saca las llaves de la mochila y arranca: un Toyota Landcruiser de antes de la guerra civil!","MECANICO: Con esa bestia te la pelan los baches del Team Enriscada. Tira pal OESTE por Taganana y baja la carretera a SAN ANDRES!"],car_spawn:["Usas el M.O. 1 · TODO TERRENO sobre el asfalto... BRRRUM-PATA-PATA-CLONK!!","Spawnea un TOYOTA LANDCRUISER de antes de la guerra civil que de algun modo aun arranca. Los baches del Team Enriscada te la pelan!","(Ojo: somos gente civilizada, el 4x4 SOLO circula por CARRETERAS y PARKINGS. Abre MOCHILA para aparcar y caminar por aceras o playas.)"],car_park:["Echas el freno de mano (un bloque de hormigon) y guardas el Toyota Landcruiser en la Mochila. Vuelves a ir a pata."],car_offroad_spawn:["Chacho, no vas a spawnear un Toyota Landcruiser encima de la acera o en mitad de la playa! Que no somos un rent-a-car de guiris.","Pisa primero una CARRETERA de asfalto o un PARKING y vuelve a usar el M.O. 1 en la Mochila."],car_indoor_spawn:['PROF. ACAYMO resuena en tu cabeza: "Chacho, cada cosa en su momento! No metas un Landcruiser del 34 bajo techo!"'],car_hazard_park:["Estas encima de un socavon o de la barrera! Avanza un metro hasta asfalto o plaza de parking firme antes de bajarte."],car_curb_hint:["Bordillo peatonal: el Landcruiser solo circula por calles y parkings. Abre la 🎒 MOCHILA desde el menú START si quieres aparcar y bajarte a pie."],pothole_first:["CLONK-BADABUM!! Pasas por encima de una zanja del Team Enriscada como si fuera mantequilla. Al Landcruiser del 34 se la pela!"],pothole_banner:["BACHE SUPERADO!","SUSPENSION DE HIERRO!","FARO PARPADEANDO...","AL TOYOTA SE LA PELA!"],tf134_blocked:["ZANJAS DEL TEAM ENRISCADA: a pie te partes tres tobillos.","Ponte sobre el asfalto, abre 🎒 MOCHILA y usa el M.O. 1 TODO TERRENO para pasarles por encima!"],carretera_sign:["TF-134 CUMBRE -> SAN ANDRES. Noche cerrada y al Landcruiser le fallan las largas: no se ve un pimiento. Sigue el asfalto al SUR!"],sanandres_vecina:["DOÑA CANDELARIA: Ay mi nino, bajaste de Anaga de noche con esos faros de vela?! Bienvenido a SAN ANDRES!","DOÑA CANDELARIA: Ni te acerques al ESTE, al CEMENTERIO DE LAS TERESITAS: alguien monto una TORRE encima y esta encantadisima!","DOÑA CANDELARIA: Sin un EQUIPO DE CAZAFANTASMAS no se puede entrar. Mejor sigue la carretera al OESTE por toda la AVENIDA ANAGA hasta Santa Cruz!"],sanandres_vecina_ghost:["DOÑA CANDELARIA: Ños!! Ese trasto que llevas a la espalda es un EQUIPO DE CAZAFANTASMAS de verdad?!","DOÑA CANDELARIA: Cuando abran la verja del CEMENTERIO DE LAS TERESITAS (al este) vas a poder subir la Torre Encantada sin que te de un aire!"],sanandres_pescador:["PESCADOR: Al ESTE queda Las Teresitas y su cementerio, donde un chiflado levanto una TORRE ENCANTADA. Ni los gatos se arriman sin equipo cazafantasmas!","PESCADOR: Tira pal OESTE en el todoterreno: coges toda la AVENIDA ANAGA pegadita al mar y caes en el Muelle, el Palmetum y el Meridiano!"],cemetery_sign:["CEMENTERIO DE LAS TERESITAS — TORRE ENCANTADA. Se oyen psicofonias y cadenas oxidadas detras del muro.","Sin un EQUIPO DE CAZAFANTASMAS ni de broma entras ahi. De momento pasamos de ella: tira al OESTE hacia Avenida Anaga!"],cemetery_sign_ready:["CEMENTERIO DE LAS TERESITAS — TORRE ENCANTADA. Tu EQUIPO DE CAZAFANTASMAS pita como loco frente a la verja!","La verja tiene un cierre de hierro con forma de bucio. Con el equipo puesto puedes entrar a la torre."],cemetery_enter:["Conectas el medidor de psicofonias. La verja reconoce el Equipo Cazafantasmas y se abre con un suspiro helado.","Una escalera de caracol sube entre lapidas. La Torre Encantada de Las Teresitas empieza aqui."],cemetery_locked:['La verja no cede. Desde dentro llega una voz que susurra "sin equipo no se sube".',"Necesitas el EQUIPO CAZAFANTASMAS que te dio El Coco de Santa Ursula."],tower_guard_block:t=>[`RECLUTA ENRISCADA: Alto! No se sube al piso ${t+1} sin vencerme. Ordenes del Team Enriscada.`,"El recluta te corta el paso en la escalera. RETALO para continuar."],tower_return:["Bajas con cuidado la escalera de caracol y sales al Cementerio de Las Teresitas."],bucio_hint:["Un bucio canario bendecido con romero en la Torre de Las Teresitas. No tienes claro pa que sirve, pero impone."],tower_bruja:['DOÑA PINO: (abanicando humo de romero seco y santiguando un mazo con un gajo de ruda) "San Borondon bendito, quitale el mal de ojo y el empacho a estas criaturas, amen..."',"DOÑA PINO: Ay, mi niño! Menos mal que echaste a esos golfos del Team Enriscada! Con tanto grito me tenian a los Magomones temblando de susto!","DOÑA PINO: Porque los Magomones NO son juguetes, eh! Son seres vivos que sienten, padecen, cogen frio por los pies y lloran si los metes en fundas de los chinos sin darles antes las buenas noches!","DOÑA PINO: Yo a mi Cabra le pongo un platito de gofio al lado del velon y le paso el santiguado cada martes. Prometeme que los vas a querer como a hijos! Toma, te regalo este BUCIO bendecido!","Recibes el 🐚 BUCIO DE LAS TERESITAS! (Guardado en tu 🎒 MOCHILA.)","TU: ...","TU: (A ver. No tengo ni la mas remota idea de por que esta señora estaba haciendo santeria canaria en el atico de un cementerio...)","TU: (...ni por que me acaba de echar una charla lacrimogena sobre dar de comer a UNOS CROMOS DE CARTON PLASTIFICADO como si fueran un podenco con ansiedad...)",'TU: (...pero sonrio educadamente, suelto un "faltaria mas, señora" y asumo que es movida local que mi cerebro de guirufo no esta preparado pa entender.)','RADIO CLUB (en el transistor de la doña): "ULTIMA HORA: abierta de par en par la incorporacion a la AUTOPISTA TF-1 SUR en Santa Cruz! Trafico fluido hasta ADEJE!"'],tower_bruja_after:["DOÑA PINO: Acuerdate de arropar bien el mazo por la noche y no barajarlo con corriente, que a las cartas les coge frio en los riñones, mi cielo!","TU: (Asientes muy serio sin entender absolutamente nada. Mejor bajamos y pillamos el Toyota por la TF-1 rumbo a ADEJE, al oeste del Recinto Ferial!)"],tf1_blocked:["🚧 INCORPORACION TF-1 (AUTOPISTA DEL SUR): CORTADA POR OBRAS DEL CABILDO.","Tus asuntos ahora estan aqui mismo: el PALMETUM (lado mar), el C.C. MERIDIANO (lado norte) y la Torre de Las Teresitas en San Andres!"],tf1_need_car:["← INCORPORACION TF-1 AUTOPISTA DEL SUR (CANDELARIA · ABADES · EL MEDANO · AEROPUERTO · ADEJE).","Ya esta abierta, pero es una AUTOPISTA, chacho: a pata te lleva puesto una Caddy blanca! Sube al TOYOTA LANDCRUISER (🎒 MOCHILA) para entrar!"],tf1_sign_open:["← AUTOPISTA TF-1 SUR (ABIERTA!): Candelaria 17 km · Abades 42 km · El Medano 56 km · Aeropuerto TFS 60 km · Adeje 78 km.","Entra conduciendo tu Toyota Landcruiser como si fuera la Ruta Bici, pero esquivando Guaguas de TITSA y furgonetas Caddy!"],tf1_candelaria:["BASILICA DE CANDELARIA Y PLAZA DE LA PATRONA. Nueve estatuas gigantes de los Menceyes Guanches vigilan el Atlantico con cara de pocos amigos."],tf1_menceyes:["ESTATUAS DE LOS MENCEYES GUANCHES. Parecen a punto de sacarte un mazo de Malpais y Volcan si tiras una pipa al suelo."],tf1_abades:["PARQUE EOLICO DE ABADES / ARICO. Cuarenta aerogeneradores dando vueltas a toda mecha: si sacas la cabeza por la ventanilla del Toyota llegas peinado a Adeje!"],tf1_faro_abades:["ABADES: casitas blancas de postal, jable dorado y el viejo sanatorio abandonado mirando al mar."],tf1_medano:["MONTAÑA ROJA Y PLAYA DE EL MEDANO. Hay tantisimo viento que las palomas vuelan marcha atras y el cielo esta lleno de cometas de kitesurf!"],tf1_airport_sign:["✈️ SALIDA 59 · AEROPUERTO TENERIFE SUR (REINA SOFIA). Mete el Toyota en el PARKING del norte, aparca y entra a pie a la TERMINAL!"],tf1_adeje_wip:["🐂 SALIDA 78 · ENTRADA A ADEJE CORTADA POR UNA ROMERIA!!","Hay una YUNTA DE BUEYES tirando de una carreta con una barrica de VINO PELEON, cuarenta magos tocando timples y olor a chorizo de Teror en mitad de la autopista!",'ROMERO MAYOR: "Chacho, frena ese Toyota! Hoy no pasa ni el Tato por la entrada de Adeje a menos que venga de ROMERIA con un buen BUCIO!"'],romeria_prompt:["🐂 La entrada a ADEJE esta totalmente cortada por una ROMERIA con yuntas de bueyes, carretas y parrandas.","Llevas el 🐚 BUCIO DE LAS TERESITAS en la mochila... ¿Te pones a tocar el bucio y te cuelas en la romeria como si estuvieras tu tambien de fiesta?"],romeria_wait:["Guardas el Bucio por ahora. La yunta de bueyes sigue rumiando tranquilamente en mitad del carril."],romeria_already_done:["La cola de la Romeria sigue desfilando hacia la ESTACION DE LAS AMERICAS. ¿Quieres ir directo alli?"],romeria_arrival_after_isa:["Despues de tres cuartos de hora de Isa Canaria a todo pulmon, dos vasos de vino peleon y medio huevo duro que te metio una abuela en el bolsillo...","...la Romeria desemboca por fin en la ESTACION DE GUAGUAS DE LAS AMERICAS, donde termina el recorrido!","Justo al OESTE se levanta el arco de entrada a CIUDAD FUCSIA (esto... ADEJE), pero un MAGO con cachorro canario y garrote te corta el paso!"],mago_americas_gate:["DON SERVANDO (EL MAGO): ¡EEEPA, QUIETO AHI EN LA RAYA, FORASTERO! ¿Vienes cantando la Isa en la romeria y te crees que vas a entrar a CIUDAD FUCSIA... digo, a ADEJE asi por las buenas?","DON SERVANDO: Antes de pisar Ciudad Fucsia (esto... Adeje) tienes que aguantar mi mazo de VINO PELEON y YUNTA DE BUEYES en combate obligatorio!"],mago_americas_after:["DON SERVANDO: ¡Ños, aguantaste el Vino Peleon y la Yunta de Bueyes sin pestañear! Ya tienes libre el paso a CIUDAD FUCSIA... digo, a ADEJE, mi niño!"],romera_americas:["ROMERA: Ay, que pecha de caminar desde la TF-1 cantando la Isa! Menos mal que la carreta traia una Barrica de Romeria y papas arrugadas."],timplista_americas:['TIMPLISTA: ♪ "A la entrada de Adeje me encontre un guirufo tocando el bucio..." ♫ ¡Chacho, te salio redonda la infiltracion!'],cartel_fucsia_adeje:['CARTEL MUNICIPAL: "BIENVENIDOS A CIUDAD FUCSIA" (alguien ha tachado "CIUDAD FUCSIA" con spray rojo y ha escrito debajo: "ESTO... COSTA ADEJE").',"↑ SIAM PARK: desde el Magma cruza la TF-1 por la pasarela norte. ← ADEJE: hotel H10, Monkeys y paseo de Troya."],siam_gate:["TAQUILLERO SIAM PARK: ¡Sawadee krap, mi niño! Bienvenido a la ZONA SAFARI de Tenerife: ¡SIAM PARK!","TAQUILLERO: Deja las cholas, ponte el bañador y ojo con las colas de los toboganes, que la peña se pica a echar duelos mientras espera!"],siam_guiri_quest_prompt:['GUIRI ROJO (DAVE): "Excuse me, mate! You look proper canarian with that tanned neck and that smell of vintage Landcruiser... could you give us a hand?"',`DAVE: "I lost my bottle of FACTOR 50 SUNCREAM somewhere near the sunbeds by the wave pool! If I don't put it on in five minutes I will literally evaporate into a cloud of tea!"`,`DAVE: "Find me that cream, brother, and I'll give you an ancient wooden pole a local goatherd gave me in Vilaflor: THE SALTO DEL PASTOR POLE (HM 4)!"`],siam_guiri_waiting:['DAVE: "Still looking like a poached salmon here, mate! Check the sandy beach loungers near the wave pool for my gold Factor 50 bottle!"'],siam_crema_pickup:["¡Encuentras el bote dorado de CREMA SOLAR FACTOR 50 tirado sobre una toalla de rayas cerca de las tumbonas!","(Huele a coco, manteca de karite y proteccion ultravioleta extrema nivel Chernobyl. Llevaselo a Dave antes de que se calcine!)"],siam_guiri_reward:['DAVE: "MY FACTOR 50!! Oh bless your soul, brother!! (se embadurna 3 kilos de crema blanca hasta parecer un fantasma de la torre) Aaaaah, instant relief!"','DAVE: "As promised: here is that giant wooden lance with the goat horn tip that shepherd gave me in the mountains! HM 4: VARA DEL SALTO DEL PASTOR!"',"¡Recibes la 🪵 M.O. 4 · VARA DEL SALTO DEL PASTOR! (Guardada en tu 🎒 MOCHILA.)",'DAVE: "With this you can vault across ledges, rocks and drop-offs like a proper canarian goatherd! Absolute legend, mate!"'],siam_guiri_done:['DAVE: "Fully coated in white paste now, mate! Factor 50 is life! Enjoy the Salto del Pastor pole!"'],siam_pukas_event:["¡¡WUUUUUUUUUUSSSSH!! La sirena de The Wave Palace retumba y una OLA DE TRES METROS rompe con fuerza bruta!","En mitad de la espuma, a un pibe que intentaba meterse en el tubo se le suelta la tabla PUKAS y sale disparada hacia la orilla.","Atrapas la tabla de surf en el aire antes de que le parta la cabeza a un flotador de patito.",'PIBE SURFERO (BORJA): "¡¡ÑOOOOOS, MENUDO REFLEJO, LOCO!! Iba directo al arrecife falso! Oye, te vi cogerla con una mano limpia de pro..."','BORJA: "Mira, a mi me da que a ti te va a hacer mas falta que a mi, que yo me voy a por un mojito al chiringuito. ¡QUEDATELA! ¡Es una PUKAS original!"',"¡Recibes la 🏄 M.O. 3 · TABLA PUKAS (SURF)! (Guardada en tu 🎒 MOCHILA.)",'BORJA: "Con la Pukas puedes surfear por cualquier charco, piscina de olas o marea de la isla. ¡A disfrutar la serie!"'],caletillas_shore_sign:["PLAZA DE LA PATRONA. El barranco corta el paso a la subestación de Caletillas, al ESTE, bajo la TF-1.","Desde estas escaleras, mira al ESTE y usa la PUKAS para cruzar la ensenada. Las vallas no dejan entrar desde la carretera."],unelco_pickup:t=>["Levantas la carta envuelta en plastico de obra: UNELCO, tierra legendaria de la subestacion de Caletillas!","UNELCO: gírala por 1 maná del color que elijas. Si decides sacrificarla, activas APAGÓN: nadie endereza tierras durante el resto del duelo.",t==="deck"?"Va directa a tu MAZO (maximo 1 copia por ser legendaria).":"Tu mazo esta lleno: Ayoze la guarda en el PC."],siam_pukas_after:['BORJA: "Esa Pukas coge tubos hasta en un vaso de agua, mi niño. ¡Remala con orgullo!"'],siam_shark_tank:["EL TÚNEL DE LOS TIBURONES (TORRE DEL PODER). Tubo acrilico transparente sumergido en un tanque donde nadan jaquetones y cazones afilados.","Ves pasar un Megalodon de Siam de seis metros rozando el cristal con la tripa. Menos mal que el metacrilato tiene 20 centimetros."],siam_sealions_pool:["PISCINA DE LOS LEONES MARINOS. Una familia de leones marinos de Siam toma el sol en las rocas y aplaude con las aletas.","El Gran Otario duerme panza arriba con una piña colada vacia apoyada en la barriga."],dona_binter_give:["DOÑA MARUCA: Ay, mi niño, ven pa aca! Tu tienes cara de viajar mas que el baul de la Piquer!","DOÑA MARUCA: Mira, llame a un concurso de la Tele Canaria pa ganar una freidora de aire y me toco un TICKET TARIFA PLANA VITALICIO DE BINTER!","DOÑA MARUCA: A mi esos avioncitos de helice me dan un yuyu tremendo, asi que quedatelo tu con descuento de residente y todo!","Recibes la ✈️ M.O. 2 · TICKET TARIFA PLANA DE BINTER! (Guardada en tu 🎒 MOCHILA.)","DOÑA MARUCA: Abre la MOCHILA cuando quieras pegar un salto en Binter... y ni se te ocurra rechazar la chocolatina Tirma que da la azafata, que es delito!"],dona_binter_after:["DOÑA MARUCA: Ya tienes la ✈️ M.O. 2 · TARIFA PLANA DE BINTER en tu 🎒 MOCHILA, mi cielo! Vuelos infinitos, agua con gas y ambrosia Tirma gratis!"],azafata_binter:["AZAFATA BINTER: Buenas tardes y bienvenido a Binter Canarias! Con la M.O. 2 Tarifa Plana puede volar desde su 🎒 MOCHILA cuando le apetezca.","AZAFATA BINTER: La linea a LA GOMERA (Centro Certificador de 1ª Edicion) esta a puntito de abrir embarque. Tenga una chocolatina mientras tanto!"],guiri_aeropuerto:['GUIRI ROJO GAMBA: "Mate, I fell asleep 12 minutes in El Medano without factor 50 and now I glow in the dark. Proper mint island though!"','TU: (Dios mio... yo me veia asi hace cuatro gimnasios?! Menos mal que ya digo "chacho".)'],airport_board:["PANEL DE SALIDAS TFS: NT104 Gran Canaria EN HORA · NT212 Tenerife Norte EN HORA · NT601 La Gomera EMBARQUE PROXIMO · Ryanair Manchester RETRASADO (sorpresa)."],airport_dutyfree:["DUTY FREE TFS: torres de dos metros de Ambrosias Tirma, ron miel, mojo en bote pa guiris y Toblerones del tamaño de una viga."],binter_fly:t=>["✈️ DING-DONG! Embarcas con tu M.O. 2 TARIFA PLANA DE BINTER. Te dan una ambrosia Tirma y un vasito de agua antes de que de tiempo a abrocharte!",`Aterrizaje suave de turbohelice ATR-72: llegas fresquito a ${t}! (Los aeropuertos también están en la tarifa plana, aunque no tengan Centro Parrandero.)`],plaza_espana:["PLAZA DE ESPAÑA Y EL CHARCO. Hacia el norte subiria la Calle del Castillo hasta Weyler, pero esta cortada por un escenario de murgas."],muelle:["MUELLE DE ANAGA Y ESTACION MARITIMA. Al sur ruge el Atlantico entre gruas, contenedores y olor a salitre."],auditorio:["AUDITORIO DE TENERIFE. La gran vela blanca de Calatrava asomada al mar al sur de la avenida."],maritimo:["PARQUE MARITIMO CESAR MANRIQUE. Piscinas de agua salada, piedra volcanica y palmeras frente al oceano."],estacion:["ESTACION DE GUAGUAS / INTERCAMBIADOR DE SANTA CRUZ. Guaguas verdes saliendo pa media isla cada tres minutos.","↑ TODO TIESO AL NORTE (en 4x4): AUTOPISTA TF-5 (Puente de Taco · Padre Anchieta · TFN · Tacoronte · El Sauzal · Acentejo · Santa Ursula)."],corte_ingles:["EL CORTE INGLÉS · TRES DE MAYO. Entrada junto a este cartel. Ascensor al fondo; Zona Gourmet en la azotea."],meridiano_sign:["C.C. MERIDIANO — TEMPLO DEL FAST FASHION. Aparca el coche, baja a pie y entra: Zara, Bershka, Pull&Bear y Primark!","(Gastas hoy, se te rompe mañana y pasado vuelves a gastar: basicamente un CASINO con perchas!)"],recinto:["RECINTO FERIAL DE TENERIFE. Huele a algodon de azucar, feria del saldo y concurso de murgas."],parking_sign:["ENTRADA AL PARKING DEL PALMETUM (GIMNASIO #4 · TIPO PLANTA). La rampa esta DE CULO: llena de socavones y con barrera.","Entra conduciendo el TOYOTA LANDCRUISER, aparca dentro y baja a pie para pasar al jardin botanico!"],parking_guard:["VIGILANTE: La entrada del parking del Palmetum esta hecha un cristo, chacho! A pata no dejo pasar por si te caes en un socavon.","VIGILANTE: Entra montado en un TODOTERRENO, aparcas en las plazas de dentro y ya caminas al GIMNASIO DE PLANTA!"],palmetum_sign:["PALMETUM DE SANTA CRUZ — GIMNASIO #4 (TIPO PLANTA). Sigue el sendero entre palmeras y dragos hasta el mirador de JONAY."],jardin:["Dejas el Landcruiser aparcado y entras a pie al PALMETUM. Cientos de palmeras canarias y dragos mecidos por la brisa del mar!","Al fondo del jardin te espera JONAY, Lider del GIMNASIO #4 (TIPO PLANTA)."],palmetum_post:["JONAY: Felicidades por tu 4o Boliche, chacho! Oye, una cosa rara: antes vi a un recluta del TEAM ENRISCADA cruzar corriendo al C.C. MERIDIANO!","JONAY: Se metio en la tienda BERSHKA con un rollo de carteles de descuento muy sospechoso. Aparca el 4x4 y echale un ojo a Meridiano!"],palmetum_after:["JONAY: Ya tienes el BOLICHE DEL PALMETUM! Pasate a pie por el C.C. MERIDIANO (justo al norte): el cartel de BERSHKA olia a trampa del Team Enriscada."],meridiano_shopper_1:["CLIENTA: Me compre esta blusa hace diez minutos por 5 duros, estornude y ahora es una bufanda! Voy a tirar otra vez en ZARA a ver si esta aguanta hasta el jueves!"],meridiano_shopper_2:["PIBE CON BOLSAS: Meridiano es puro casino, hermano: gastas hoy, se te rompe mañana y pasado estas haciendo cola otra vez! Prueba las cajas de rebajas!"],meridiano_shopper_hint_before:["DEPENDIENTA: Ese pibe con chaleco del TEAM ENRISCADA lleva dos horas colgando un cartel de descuento en BERSHKA, al fondo. Ni trabaja aqui!"],meridiano_shopper_hint_after:["DEPENDIENTA: Oye! En cuanto ganaste en el Palmetum, el notas del TEAM ENRISCADA que colgaba el cartel de BERSHKA desaparecio por arte de magia... y dejo el cartel rarisimo!"],enriscada_bershka:["RECLUTA ENRISCADA: (silbando nervioso) Eh, tu! Solo estoy colgando este cartel de DESCUENTO -70% EN BERSHKA! Totalmente normal!","RECLUTA ENRISCADA: Detras de este cartel de carton piedra NO hay ningunas escaleras mecanicas secretas, vale?! Circula a comprar calcetines!"],bershka_poster_weird_seen:["Oye... el miembro del TEAM ENRISCADA que estaba aqui colgando el cartel de descuento de BERSHKA ya no esta!",'Te fijas bien y el cartel de "BERSHKA -70%" esta torcido, abombado y sale aire frio con olor a espresso por debajo...'],bershka_poster_weird_unseen:['El cartel de descuento de "BERSHKA -70%" esta colgado fatal, medio despegado, y el recluta del Team Enriscada que lo puso ha desaparecido.',"Al acercarte notas corriente de aire y un zumbido metalico detras del cartel..."],bershka_poster_reveal:["Apartas el cartel de descuento de BERSHKA y pulsas un perchero falso... CLANK-RRRRRR!!","Se abre un probador oculto con unas ESCALERAS MECANICAS bajando a la GUARIDA ENRISCADA!! (Pisalas a la derecha para bajar!)"],bershka_poster_already:["Detras del cartel torcido de BERSHKA siguen abiertas las ESCALERAS MECANICAS a la Guarida Enriscada (justo a la derecha)."],don_michi_npc:['DON MICHI: "Miau... capisci?" (Te mira por encima del hombro mientras afila las unas en una caja de Bershka.)'],copier_prop:['Solo queda el hueco de la fotocopiadora y un cartel: "TRASLADADA A MAGOS DE LA COSTA". El Coco se llevó la máquina de verdad.'],coco_meridiano_first:["EL COCO: Buonasera, guirufo... digo, buenas tardes mi niño. Soy EL COCO DE SANTA URSULA, un humilde empresario norteño... nada italiano, capisci? 🤌","EL COCO: Has bajado por el probador falso como si fuera tu casa. Aquí abajo mis gatos hacen de guardia y el EQUIPO CAZAFANTASMAS vive en mi cajón."],coco_meridiano_again:["EL COCO: ¿Otra vez por mi sótano? Mi espresso está caliente y mi paciencia también.","EL COCO: Si me ganas, el equipo cazafantasmas es tuyo y yo me voy a MAGOS DE LA COSTA. Si no... el ascensor de Bershka te espera."],coco_magos_first:["EL COCO: ¿Vienes a mi azotea de Magos de la Costa a faltarme al respeto? ¡Ricardo García está secuestrado por un contrato de copias!","EL COCO: Don Michi y mis gatos te harán una oferta que no podrás rechazar. Aquí arriba ya no te salva ni el probador falso."],coco_magos_again:["EL COCO: ¡Otra vez aquí arriba! Ricardo se te quedó mirando con ojos de profesor de matemáticas.","EL COCO: La fotocopiadora no se muda dos veces, ragazzo. O juegas, o bajas por las escaleras de incendios."],magos_ricardo:["RICARDO GARCÍA: ¡Menos mal que llegaste! El Coco me tenía aquí secuestrado firmando pagarés y contando cartas falsas mientras bajaba al terrero.","RICARDO GARCÍA: Yo solo quería diseñar un juego de cartas coleccionables donde los magos se tiran rayos y gestionan maná... y mira en lo que ha acabado la costa.","RICARDO GARCÍA: Dicen que el azar equilibra la matemática, pero a mí el Coco me equilibró dos hostias bien dadas.","EL COCO: Ecco... basta de cháchara matemática, profesor Garfield... digo, García. La máquina de fotocopias no duplica tus cartas, ragazzo: copia las del rival EN PLENO DUELO.","EL COCO: Una Master Ball de papel, capisci? La sacas en pleno combate, le copias una carta al rival y la copia te entra directa a la mano. Toner para una sola vez.","(En combate, la FOTOCOPIADORA se usa con el botón FOTO.)"],ricardo_waiting:["RICARDO GARCÍA: El Coco sigue en la azotea con Don Michi. Gánale y esa fotocopiadora pasa a ser tuya... siempre que no la use para fotocopiar mis reglamentos.","RICARDO GARCÍA: Consejo de diseñador: los jugadores recuerdan una jugada injusta mucho antes que un balance perfecto."],magos pais."]}}]},colegio:{id:"colegio",name:"Patio del Colegio (Recreo)",rows:["#WWJ##JWW#","#...oo...#","#..cccc..#","#..cccc..#","#..cccc..#","#..cccc..#","#h......M#","#........#","ffffDfffff"],legend:{...Ii,J:"colegio",c:"court",o:"hoop",h:"bench",M:"table",f:"fence"},npcs:[{id:"conserje",sprite:"conserje",x:1,y:7},{id:"chinijo_a",sprite:"chinijo",x:3,y:4,schoolKid:0},{id:"chinijo_b",sprite:"chinija",x:6,y:4,schoolKid:1}],triggers:[{x:4,y:8,kind:"step",action:{type:"exitSchool"}},{x:8,y:6,kind:"interact",action:{type:"text",lines:["Poyo del recreo: medio bocata de chorizo Teror en papel albal y un tazo roido."]}},{x:4,y:1,kind:"interact",action:{type:"text",lines:["Canasta del patio sin red. El aro esta doblado de colgarse los de sexto."]}}]}},za={yeray_first:["YERAY: Chacho loco! Yo que tu no salia a OFRA asi como vas...","YERAY: Cruza para LA CANDELARIA (el hospital) y elige tu CARTA INICIAL.","YERAY: Sal a la calle, tira pal OESTE hasta WEYLER y coge el tranvia Linea 1. Pregunta por el profesor ACAYMO.","Yeray se mete en el 3o B. Libre el paso."],yeray_again:["YERAY: Pal oeste, chacho! Al este solo esta el muelle y el agua."],acaymo_intro:["ACAYMO: Epa! Tu debes ser el guirufo nuevo.","ACAYMO: Aqui jugamos con TIERRAS canarias (Volcan, Charco, Laurisilva, Playa y Malpais). Robas 7 y lo que muere, muerto se queda.","ACAYMO: Mira las tres cartas del mostrador, elige una y probamos tu mazo promocional en la mesa."],acaymo_after_battle:["ACAYMO: Ños, nada mal pa ser tu primer dia en Tenerife!","ACAYMO: Ahora hazme un favor: el CHINO DE TACO me tiene un pedido guardado.","ACAYMO: Sal del hospital, sigue pal OESTE, cruza el puente sobre la TF-5 y llegas a Taco. Ni se te ocurra abrir la caja."],acaymo_pending:["ACAYMO: Sigue pal OESTE, cruza el puente de la TF-5 y pidele mi paquete al Chino de Taco."],acaymo_delivery:["Acaymo rasga la caja delante tuyo. Saca un tutu rosa, unas alitas con purpurina y una peluca rubia.","ACAYMO: Ños, ahora si, el tutu, las alitas y la peluca ya estoy listo para la cabalgata anunciadora, hasta luego pibe!","Acaymo sale pitando por la puerta de atras dandose aire con las alitas."],bencomo_arrival:["BENCOMO: ...No me mires asi, soy Bencomo, el becario. Cada carnaval me hace la misma.","BENCOMO: Toma la MAGODEX: una libreta de resorte pa ir apuntando los magomones que veas.","BENCOMO: Y una fotocopia de la RUTA DEL BUEN YANTAR con 8 guachinches. Gana a sus LIDERES pa sacar los 8 BOLICHES e ir al ALTO MANDO.","BENCOMO: Pal primero vuelve a WEYLER (al este) y sube TO TIESO PARRIBA por Ramon y Cajal hasta el GUACHINCHE-TRUCK en el parking de la ULL!","BENCOMO: Truco de local: si te quedas corto de cartas, CUELATE EN LOS COLEGIOS a jugar con los chinijos del patio (son repetibles!)."],bencomo_again:["BENCOMO: Sube desde WEYLER hasta el Guachinche-Truck de la ULL (Gym #1), y si te faltan cartas cuelate en los colegios del camino!"],chino_give:["CHINO: Ah, el pedido de Acaymo! Toma, pesa poco pero brilla mucho.","CHINO: Vuelve pal ESTE cruzando el puente de la TF-5 hasta La Candelaria."],chino_none:["CHINO: Buenas, jefe. Si buscas un pedido especial, solo entrego con encargo del profe Acaymo."],chino_have:["CHINO: Llevaselo a Acaymo en La Candelaria, pal este cruzando la TF-5."],counter_empty:["Ya tienes tu mazo promocional. Mejor no mangar otro."],ayoze_first:["AYOZE: Buenas, soy Ayoze, el del PC. Lo que no quepa en el mazo (max 60, 4 copias por carta) te lo guardo yo.","AYOZE: En cada sobre eliges UNA de cinco. Si es tu 5a copia de un magomon, puedes EVOLUCIONARLA al vuelo o guardarla en mi PC.","AYOZE: Y si ya te ventilaste a los entrenadores de la calle, cuelate en los COLEGIOS: los ninos del patio juegan infinitas veces!"],ayoze_again:["AYOZE: Mi PC va contigo a todas partes: mazo, coleccion y combinador (5 copias = 1 evolucion).","(El PC DE AYOZE está en el menú START.)"],chaxiraxi_heal:["CHAXIRAXI: Bienvenido al Centro Parrandero, mi nino! Dejame aca ese mazo.","Tin-tin-tin-ta-TIIIIN! Chaxiraxi te plancha las fundas y te sirve un barraquito con limon y canela.","CHAXIRAXI: Listo! Ya tienes este Centro Parrandero fichado y el azucar arriba."],tio_suso:["TIO SUSO: (rasgueando el timple) Dos reglas sagradas del archipielago, mi nino:","TIO SUSO: A cero duros peleas SIN RIESGO, y si te faltan sobres cuelate en el patio de un COLEGIO: los chinijos nunca se cansan!"],subida_locked:["Un operario con un cono te frena en seco.","OPERARIO: Chacho, ande vas subiendo Ramon y Cajal sin libreta ni Ruta del Buen Yantar? Termina primero en LA CANDELARIA (al oeste)."],anaga_locked:["Una estudiante con paraguas te corta el paso.","ESTUDIANTE: Vas pa San Benito y Anaga sin el primer Boliche?! Habla con DOMINGO ahi mismo en el Guachinche-Truck del parking!"],domingo_post:["DOMINGO: Ya tienes mi BOLICHE DEL CARNE FIESTA, titan! Ahora sal del campus por el NORTE hacia SAN BENITO.","DOMINGO: De San Benito tira TO RECTO AL ESTE a LAS MERCEDES, sube por la CARRETERA GENERAL (noreste), cruza LLANO DE LOS VIEJOS, baja las VUELTAS DE TAGANANA y llegas al Gym #2 en TAGANANA!"],pedro_closed:["PEDRO: (rasgueando la guitarra con mirada intensa) Ay, muchacho... CATHAYSA no esta. El gimnasio esta cerrado.",'PEDRO: "Cathaysa, la nina guanche, no vera mas Taganana..." Se fue hacia el mar, alla abajo en la playa de ALMACIGA (al este).',"PEDRO: Baja a ALMACIGA a sacarla del agua antes de que me inspire otro disco doble en directo!"],pedro_after:['PEDRO: (afinando el mi menor) "...y volvio en cholas con olor a salitre..." No me mires asi, que a mi me sonaba poetico! Habla con Cathaysa ahi al lado.'],gym2_open_door:["LA OLA DE TAGANANA (Gimnasio #2). Cathaysa esta aqui mismo en la puerta esperandote con la tabla!"],cathaysa_surf_prompt:["CATHAYSA: (desde la rompiente) EPAAA! Una olita mas y salgo, lo juro!! ...Uy, chacho, que me trinco el invento en la baja y la corriente tira pa fuera!","CATHAYSA: Eh, tu, el guirufo de las cholas! Echame una mano pa salir del agua como si yo fuera Bill el del PC!"],cathaysa_rescue_rope:["Agarras el cabo amarrado a la roca, tiras con alma de guirufo quemao y una ola te empapa hasta los calcetines...","PLAF! Cathaysa sale disparada a la arena negra haciendo un aereo perfecto con la tabla bajo el brazo!","CATHAYSA: Ñooos, que rescate, mi nino! Y seguro que arriba estaba Pedro dandole a la guitarra dramatico perdido!","CATHAYSA: Que vienes a por el Boliche del Gimnasio #2?! Tira pa TAGANANA (al oeste), que subo corriendo a abrirte!"],cathaysa_rescue_papas:['Te pones las manos de bocina y gritas: "CATHAYSAAA, QUE PEDRO ESTA CANTANDO OTRA VEZ EN LA PUERTA DEL GYM!!"',"Cathaysa rema a 45 nudos, parte una ola en dos y clava la tabla en la arena negra en uno coma tres segundos.","CATHAYSA: OTRA VEZ CON LA CANCIONCITA?! Menos mal que me avisaste, pibe! Tira pa TAGANANA (al oeste), que abro el Gimnasio #2 ahora mismo!"],cathaysa_after_gym:["CATHAYSA: Fuerte paliza me diste, pibe! Ya tienes dos Boliches: el siguiente gimnasio esta en las CUEVAS PINTADAS DE GALDAR.","CATHAYSA: El problema es que la carretera a SAN ANDRES esta cortada porque el TEAM ENRISCADA abrio todo el piche buscando algo.","CATHAYSA: Asi que baja a BENIJO (siguiendo la costa al ESTE, pasando Almaciga). Alli hay un CAYUQUERO, Carmelo: dile que vas de mi parte y te lleva!"],enriscada_1:["RECLUTA ENRISCADA: Alto ahi, guirufo! La carretera a SAN ANDRES esta cortadisima!","RECLUTA ENRISCADA: El TEAM ENRISCADA levanto tres kilometros de piche buscando una reliquia guanche... y de momento solo hemos encontrado una tuberia del agua y tres cholas del 94."],enriscada_2:['RECLUTA ENRISCADA: El jefe dijo "caven debajo del piche de San Andres". Llevo desde el martes dandole al pico y tengo las manos en carne viva!',"RECLUTA ENRISCADA: Si quieres salir de Taganana por mar, buscate la vida en BENIJO, al este!"],carmelo_wait:["CARMELO: Buenas, mi nino. Estoy aqui en BENIJO amarrando el fueraborda del cayuco con alambre dulce y dos rezos.","CARMELO: Si buscas a Cathaysa la del gimnasio, seguro que esta metida en el agua en ALMACIGA. Cuando le ganes el Boliche hablamos."],carmelo_offer:["CARMELO: Que vienes de parte de Cathaysa pa cruzar a GALDAR porque el Team Enriscada abrio el piche de San Andres?!","CARMELO: Yo te llevo, mi nino! Mira que joya: cayuco de chapas remachadas y un fueraborda dos tiempos que ruge a 120 decibelios!","CARMELO: El mar esta un fisco picao y el motor echa un humillo curioso, pero en un salto te planto en Galdar. Subes?"],cayuco_arrival:["Te limpias la boca temblando en el muelle de Galdar, con el pitido de 120dB aun taladrandote el oido y olor a gasolina mezcla en las cejas...","TU: ...Chacho, hasta el Armas se mueve menos.","...","Te quedas congelado en mitad del muelle. De donde demonios acaba de salir esa frase?!","Hace nada eras un guirufo desempacando cajas en Santa Cruz... te estas volviendo un poco canario?!"],canarion_closed:["CANARION: Merameneño, aqui por mucho boliche que traigas no te dejamos pasar ni jartos grifa, ni aunque traigas fleje guita, ni nada, asi que vete a buscarte unas roscah y sientate en un banco que de pie te cansas, que aqui hasta landon no abremoh.","TU: ...Ok, quizas no era tan canario. Voy a ver si abajo en el muelle alguien tiene un traductor."],canarion_open:['CANARION: Pasa pa dentro, mi nino. Que conseguiste un traductor en el barco? Que va, chacho: esto esta abierto porque YA SON LAS DOS ("landon"), no porque tu hayas encontrado nada, no se te vayan a subir los humos!'],oficial_olsen_closed:["OFICIAL OLSEN: El fast-ferry S.S. OLSEN esta en escala tecnica. Solo dejamos subir a bordo por emergencia maritima o linguistica. Sube primero las curvas hacia GALDAR."],oficial_olsen_open:['OFICIAL OLSEN: Que arriba en las Cuevas Pintadas te soltaron un "merameneño" cerrado y buscas un TRADUCTOR? Pasa al S.S. OLSEN, el Capitan habla hasta silbo!'],viajero_frio:["PASAJERO: Chacho, en el S.S. Olsen ponen el aire acondicionado tan fuerte que entras en bermudas en Agaete y sales hecho un calipo de lima en Santa Cruz!"],capitan_mareado:["CAPITAN: Ufff... bluurgh... Que fatiga mas mala, mi nino... Treinta anos cruzando el canal a 38 nudos en el S.S. Olsen y me vengo a marear atracado en el muelle...","CAPITAN: Dame unas friegas en el lomo como al Capitan del S.S. Anne, hazme esa caridad...","Le frotas la espalda al Capitan con brio. CRAC-CRAC! El Capitan recupera el color al instante!","CAPITAN: Mano de santo, pibe! Buscabas un TRADUCTOR pa entender al portero de las Cuevas Pintadas? Toma mi glosario canarion de bolsillo!",'TRADUCTOR: "Merameneño" = Mira mi nino · "Fleje guita" = Mucho dinero · "Roscah" = Cotufas · "Hasta landon" = ...HASTA LAS DOS DE LA TARDE!!',"BOOOOM! Suena la bocina del S.S. Olsen marcando las 14:00 (LAS DOS). Ya habran abierto las Cuevas Pintadas arriba en Galdar!"],capitan_curado:['CAPITAN: Ya estoy como una rosa, mi nino! Sube otra vez las Curvas del Demonio: como ya son las dos ("landon"), las Cuevas Pintadas estaran abiertas!'],arqueologo_cueva:["ARQUEOLOGO: (llorando bajito) Diez anos excavando las CUEVAS PINTADAS con pincelito... y montan dentro un GUACHINCHE DE VERDAD con calderos de carne fiesta y cuarto de vino!"],camarero_cueva:["CAMARERO: Bienvenido al Guachinche de las Cuevas Pintadas! El jefe Bentejui se encerro en LA COCINA con dos cerrojos electricos.","CAMARERO: Hay 15 mesas: DOS contiguas tienen botones escondidos bajo el mantel y EL RESTO TIENEN CARNE FIESTA. Si fallas el segundo boton, se resetean los cerrojos!"],bentejui_post:["BENTEJUI: Ya llevas TRES BOLICHES en la faja, merameneño! Como el S.S. Olsen ya zarpo, baja al muelle y vuelve a BENIJO en el CAYUCO de Carmelo!","BENTEJUI: Un primo mio mecanico te espera en Benijo con el M.O. 1 TODO TERRENO pa que pases los baches a SAN ANDRES y bajes al PALMETUM!"],vecino_rc:['SEÑOR: Uf... puf... "tira to tieso parriba", decian. Ramon y Cajal convalida como dia de pierna.'],est_ull:["UNIVERSITARIA: Campus Central de la ULL! A la derecha tienes a DOMINGO en el Guachinche-Truck ( a el BOLICHE DEL PALMETUM, 60 duros y mi sobre botanico!"],lose:["JONAY: La laurisilva siempre gana, guirufo! Vuelve cuando traigas mejores tijeras de podar."]},enriscada_guarida_1:{id:"enriscada_guarida_1",tier:6,name:"KEVIN",title:"Becario del Team Enriscada",purse:36,biomes:["ofra"],ace:"gato_callejero",deck:[...x("tierra_malpais",9),...x("tierra_playa",3),...m("michino",3),...m("gato_callejero",4),...m("gato_azotea",2),...m("lagarto",2),...m("lapa_acorazada",1),...m("calima",3),...m("chola",2)],taunt:["KEVIN: EH?! Como descubriste las escaleras mecanicas detras del cartel de descuento del Bershka?!","KEVIN: Se me olvido pegarlo con celo doble cara! Mis gatos callejeros te van a arañar las cholas!"],win:["KEVIN: Ay mi madre, el Coco de Santa Ursula me va a poner a doblar camisetas del Primark toda la vida!"],lose:["KEVIN: Fuera del sotano VIP del Bershka, guirufo!"]},enriscada_guarida_2:{id:"enriscada_guarida_2",tier:6,name:"TONI",title:"Consigliere... digo Vocal Enriscada",purse:42,biomes:["ofra"],ace:"gato_azotea",deck:[...x("tierra_malpais",10),...x("tierra_playa",3),...m("michino",2),...m("gato_callejero",3),...m("gato_azotea",3),...m("don_michi",1),...m("lapa_acorazada",2),...m("calima",3),...m("chola",2)],taunt:["TONI: Alto ahi, ragazzo... digo, muchacho! Detras de esta puerta esta el despacho de EL COCO DE SANTA URSULA!","TONI: Financiamos las zanjas de Anaga con camisas fast-fashion que se desintegran a las 24 horas. Negocio redondo!"],win:["TONI: Mamma mia, que tunda! Pasa si te atreves, el Coco esta acariciando a Don Michi..."],lose:["TONI: Dormiras con las viejas en sancocho, chacho!"]},coco_santa_ursula:{id:"coco_santa_ursula",tier:7,name:"EL COCO",title:"EL COCO · AZOTEA DE MAGOS DE LA COSTA",purse:75,elite:!0,biomes:["ofra"],ace:"don_michi",deck:[...x("tierra_malpais",10),...x("tierra_playa",3),...x("tierra_charco",2),...m("michino",2),...m("gato_callejero",3),...m("gato_azotea",4),...m("don_michi",3),...m("lapa_acorazada",2),...m("calima",3),...m("chola",2),...m("barraquito",2)],taunt:["EL COCO: Buonasera, guirufo... digo, buenas tardes mi nino. Soy EL COCO DE SANTA URSULA, un humilde empresario norteño... nada italiano, capisci? 🤌","EL COCO: Has bajado por el probador falso como si fuera tu casa. Aqui abajo mis gatos hacen de guardia."],win:["EL COCO: Mamma mia!! Me despeinaste la gomina y dejaste a Don Michi ronroneando! Esta bien, ragazzo, sabes jugar con honor!"],lose:["EL COCO: Arrivederci, chacho! Que Toni te acompañe por las escaleras mecanicas hasta la seccion de calcetines!"]},senderista_hans:{id:"senderista_hans",name:"SENDERISTA HANS",title:"Montaña Blanca · Rucksack Nr. 1",purse:66,tier:8,biomes:["risco","pinar"],ace:"cabra_titan_teide",deck:[...x("tierra_volcan",8),...x("tierra_laurisilva",6),...m("baifo",4),...m("cabra",3),...m("cabra_chispera",3),...m("cabra_titan_teide",2),...m("cardon",3),...m("mojo",3),...m("tolete",3),...m("gofio",2)],taunt:["SENDERISTA HANS: Guten Tag! Llevo tres horas subiendo y mi mochila pesa más que tu mazo. ¡Una partida antes de la cornisa!"],win:["SENDERISTA HANS: Sehr gut! Toma 66 duros y una carta. Achtung: la próxima cornisa no se cruza andando."],lose:["SENDERISTA HANS: Ich gewinne! Vuelve cuando hayas descansado, junger Mann."]},senderista_greta:{id:"senderista_greta",name:"SENDERISTA GRETA",title:"Montaña Blanca · Rucksack Nr. 2",purse:68,tier:8,biomes:["mar","pinar"],ace:"pardela_tormenta",deck:[...x("tierra_playa",8),...x("tierra_laurisilva",6),...x("tierra_volcan",4),...x("tierra_charco",4),...m("pardela",4),...m("pardela_tormenta",3),...m("cernicalo_alisio",3),...m("pinzon_chispero",3),...m("fenix_azul_teide",2),...m("clipper",3),...m("chola",3)],taunt:["SENDERISTA GRETA: Achtung! Hier wechselt der Wind alle drei Karten. Como mis calcetines, que también cambian solos."],win:["SENDERISTA GRETA: Sehr ordentlich! Toma 68 duros y elige carta. El viento ya no te mirará raro."],lose:["SENDERISTA GRETA: Der Wind hat dich besiegt, no mi mazo."]},senderista_klaus:{id:"senderista_klaus",name:"SENDERISTA KLAUS",title:"Montaña Blanca · Rucksack Nr. 3",purse:70,tier:8,biomes:["ofra","fantasma"],ace:"lagarto_magma",deck:[...x("tierra_malpais",9),...x("tierra_volcan",5),...m("lagarto",3),...m("lagarto_gigante",3),...m("lagarto_magma",3),...m("lapa_acorazada",3),...m("perita_barranco",3),...m("calima",3),...m("cortar_el_aire",3)],taunt:["SENDERISTA KLAUS: Ich habe eine Karte verloren... y mi hermano dice que estaba bajo una piedra. ¿La viste? ¡Jugamos!"],win:["SENDERISTA KLAUS: Das war meine Karte! Bueno, quédate con 70 duros y una del sobre. Ich suche weiter."],lose:["SENDERISTA KLAUS: Me ganaste, pero sigo buscando la carta entre las piedras."]},cole9_a:{id:"cole9_a",name:"LENA (Refugio)",title:"Patio Nv.9 · Montaña Blanca",purse:34,repeatable:!0,tier:8,biomes:["risco","pinar"],ace:"cabra_chispera",deck:[...x("tierra_volcan",7),...x("tierra_laurisilva",7),...m("baifo",4),...m("cabra",3),...m("cabra_chispera",3),...m("semilla",3),...m("mojo",3),...m("gofio",2)],taunt:["LENA: ¿También subiste corriendo? Pues en el recreo del refugio se juega con guantes. ¡34 duros y sobre!"],win:["LENA: ¡Ganaste! Aquí arriba los guiris no llegan, pero los sobres sí. Repetimos."],lose:["LENA: El recreo más alto de Tenerife es mío. Vuelve cuando quieras."]},cole9_b:{id:"cole9_b",name:"JONAS (Refugio)",title:"Patio Nv.9 · Montaña Blanca",purse:34,repeatable:!0,tier:8,biomes:["mar","ofra"],ace:"kraken_anaga",deck:[...x("tierra_charco",7),...x("tierra_malpais",7),...x("tierra_playa",3),...m("choco",4),...m("calamar",3),...m("kraken_anaga",2),...m("vieja_reina",3),...m("clipper",3),...m("chola",3)],taunt:["JONAS: Mein Vater sagt que el pudding de aquí sabe a nieve. Yo solo sé que mi mazo no pierde en el recreo."],win:["JONAS: Du hast gewonnen! Toma 34 duros y una carta. Ich übe für die nächste Pause."],lose:["JONAS: Achtung! Otro intento, que aún queda recreo."]},[mr]:{id:mr,name:"EL COCO",title:"GUACHINCHE #8 · EL DIABLITO",tier:8,gym:8,purse:100,bolicheName:"Boliche del Diablito",biomes:["ofra"],ace:"don_michi",deck:[...x("tierra_malpais",14),...x("tierra_playa",6),...x("tierra_charco",3),...m("michino",3),...m("gato_callejero",4),...m("gato_azotea",4),...m("don_michi",4),...m("lapa_acorazada",3),...m("bidon_toxico",2),...m("calima",3),...m("chola",3),...m("barraquito",2),...m("cortar_el_aire",2)],taunt:xg,win:["EL COCO: ¡Mamma mia! Trato es trato: el BOLICHE DEL DIABLITO es tuyo. El último de la Ruta, más 100 duros y un sobre. ¡Pero la pizza se paga aparte!"],lose:["EL COCO: Aún queda horno para ese mazo. El último boliche se queda conmigo; vuelve después de pasar por el Centro Parrandero del pueblo."]},cole8_a:{id:"cole8_a",name:"GARA (Santa Úrsula)",title:"Patio Nv.8 · Santa Úrsula",purse:32,repeatable:!0,tier:7,biomes:["pinar","risco"],ace:"cabra_chispera",deck:[...x("tierra_volcan",7),...x("tierra_laurisilva",7),...m("baifo",3),...m("cabra",3),...m("cabra_chispera",3),...m("tajinaste",2),...m("mojo",3),...m("gofio",2)],taunt:["GARA: En Santa Úrsula se juega hasta que toque el timbre. ¿Treinta y dos duros y una carta del sobre?"],win:["GARA: ¡Buena partida! Toma el premio. Si vas a El Diablito, practica conmigo las veces que quieras."],lose:["GARA: ¡El recreo es mío! Vuelve a probar, que todavía queda media hora."]},cole8_b:{id:"cole8_b",name:"AIRAM (Santa Úrsula)",title:"Patio Nv.8 · Santa Úrsula",purse:32,repeatable:!0,tier:7,biomes:["mar","pinar"],ace:"vieja_abismo",deck:[...x("tierra_charco",8),...x("tierra_playa",6),...m("choco",4),...m("calamar",3),...m("vieja_reina",3),...m("vieja_abismo",2),...m("chola",3),...m("barraquito",2)],taunt:["AIRAM: ¿También oíste a uno cantar en el restaurante cerrado? Mejor echamos una antes de ir a mirar."],win:["AIRAM: Toma 32 duros y elige carta. Siempre me queda otro sobre para la revancha."],lose:["AIRAM: Hoy mis peces no perdonan ni en el recreo."]},guachinche_rosario:{id:"guachinche_rosario",name:"DOÑA SABINA",title:"LIDER GYM #6 · GUACHINCHE DE EL ROSARIO",purse:45,tier:6,gym:6,bolicheName:"Boliche de la Mesa del Fondo",biomes:["risco","ofra"],ace:"garrafa_peleon",deck:[...x("tierra_laurisilva",6),...x("tierra_volcan",5),...x("tierra_playa",2),...m("cuarta_vino",3),...m("garrafa_peleon",3),...m("baifo",3),...m("cabra",2),...m("tunera",2),...m("gofio",3),...m("mojo",2),...m("tolete",2),...m("parranda",2)],taunt:["DOÑA SABINA: El viento de Las Mercedes me trajo tu nombre antes de que llamaras a la puerta. Nueve salas y nueve velos, pero solo una mesa ve el futuro: la del fondo.","DOÑA SABINA: Déjame mirarte la mano... Tus cartas ya me hablaron. Los teleportes los puse pa que nadie pierda el camino de vuelta. ¿Jugamos?"],win:["DOÑA SABINA: La bola se empañó y el vino peleón se rindió. Toma 45 duros, elige tu carta y guarda el SEXTO BOLICHE: la mesa del fondo te lo predijo."],lose:["DOÑA SABINA: El poso de la taza aún no te dice nada claro. Vuelve cuando las cartas te hablen bajito, chacho."]},enriscada_magos_1:{id:"enriscada_magos_1",name:"MATÓN YERAY",title:"Team Enriscada · Magos P1",purse:32,biomes:["ofra"],ace:"gato_callejero",tier:6,deck:[...x("tierra_malpais",8),...x("tierra_volcan",3),...m("michino",3),...m("gato_callejero",3),...m("lagarto",2),...m("calima",2),...m("tolete",2)],taunt:["MATÓN YERAY: ¡Alto ahí! Magos de la Costa está intervenida por la famiglia de Santa Úrsula. Si quieres pisar teletransportadores, te vas a marear."],win:["MATÓN YERAY: ¡Me tiraste los gatos por el hueco del ascensor! Sigue subiendo si tienes narices."],lose:["MATÓN YERAY: Pa abajo por las escaleras de emergencia, mi niño!"]},enriscada_magos_2:{id:"enriscada_magos_2",name:"SECRETARIA CHANI",title:"Seguridad · Archivo P2",purse:36,biomes:["ofra","risco"],ace:"gato_azotea",tier:6,deck:[...x("tierra_malpais",8),...x("tierra_laurisilva",4),...m("gato_callejero",3),...m("gato_azotea",3),...m("lapa",2),...m("lapa_acorazada",1),...m("calima",2),...m("gofio",2)],taunt:["SECRETARIA CHANI: En el archivo guardamos los contratos de copias. ¿Buscas la llave magnética? Primero tendrás que pasar por encima de mi turno."],win:["SECRETARIA CHANI: ¡La llave está sobre el archivador del fondo! Quédatela, total el Coco no me paga las horas extra."],lose:["SECRETARIA CHANI: Cita previa por ventanilla, guirufo!"]},enriscada_magos_3:{id:"enriscada_magos_3",name:"IMPRESOR NAUZET",title:"Taller de Copias · Magos P3",purse:40,biomes:["ofra","mar"],ace:"don_michi",tier:6,deck:[...x("tierra_malpais",7),...x("tierra_charco",5),...m("michino",2),...m("gato_azotea",3),...m("gato_callejero",2),...m("calamar",3),...m("clipper",2),...m("calima",2)],taunt:["IMPRESOR NAUZET: ¡Aquí se imprime la magia! La máquina buena se la llevó el jefe a la azotea, pero mis gatos tienen garras de imprenta."],win:["IMPRESOR NAUZET: ¡Se me atascó el tóner! Pisa el pad noroeste para ir a Dirección."],lose:["IMPRESOR NAUZET: ¡Copia denegada por la directiva!"]},enriscada_magos_4:{id:"enriscada_magos_4",name:"ESCOLTA AYTHAMI",title:"Guardaespaldas · Dirección P4",purse:44,biomes:["ofra","pinar"],ace:"don_michi",tier:6,deck:[...x("tierra_malpais",8),...x("tierra_playa",4),...m("gato_callejero",2),...m("gato_azotea",3),...m("don_michi",2),...m("cernicalo",2),...m("calima",3),...m("chola",2)],taunt:["ESCOLTA AYTHAMI: La puerta de la azotea necesita dos llaves y mi bendición. Y ninguna de las tres te la vas a llevar gratis."],win:["ESCOLTA AYTHAMI: El Coco te va a doblar como una carta mojada... Arriba tienes la azotea."],lose:["ESCOLTA AYTHAMI: El despacho del jefe no recibe visitas."]},tf5_taco_puente:{id:"tf5_taco_puente",name:"ADAY (CADDY)",title:"TF-5 · Bajo Puente de Taco",purse:52,tier:6,biomes:["risco","ofra"],ace:"lagarto_gigante",deck:[...x("tierra_volcan",8),...x("tierra_malpais",6),...m("cuarta_vino",3),...m("baifo",3),...m("pollito_frontera",3),...m("lagarto_gigante",3),...m("lapa_acorazada",2),...m("mojo",3),...m("tolete",2),...m("calima",2)],taunt:["ADAY: ¡PIIII! ¡Mira pa arriba, chacho: el tranvía nos acaba de adelantar por encima del Puente de Taco y nosotros en punto muerto!","ADAY: Saca el tapete por la ventanilla, que de aquí a Padre Anchieta nos da tiempo a tres partidas."],win:["ADAY: ¡Ños, me barriste antes de que avanzáramos dos metros! Tira pa arriba, que en Anchieta se pone peor."],lose:["ADAY: Te fundí sin quitar el freno de mano."]},tf5_guajara:{id:"tf5_guajara",name:"KEVIN (TF-5)",title:"Subida Guajara · En 1ª marcha",purse:54,tier:6,biomes:["pinar","risco"],ace:"pinzon_chispero",deck:[...x("tierra_laurisilva",8),...x("tierra_playa",6),...m("pardela",3),...m("pinzon",3),...m("pinzon_chispero",3),...m("cernicalo_alisio",2),...m("cardon",2),...m("chola",3),...m("gofio",2),...m("parranda",2)],taunt:["KEVIN: Salí de Santa Cruz el lunes pa llegar al examen de las 8:30 en Guajara... y creo que ya estoy en convocatoria de julio.","KEVIN: ¿Echamos una mientras se enfría el embrague?"],win:["KEVIN: Convalidado con matrícula. Sigue al norte, que ya se ve el tapón legendario de Padre Anchieta."],lose:["KEVIN: Suspenso en retenciones I y II, chacho."]},tf5_anchieta_1:{id:"tf5_anchieta_1",name:"CHOFER FIDEL",title:"TITSA 102 · Padre Anchieta",purse:58,tier:6,biomes:["risco","pinar"],ace:"cabra_chispera",deck:[...x("tierra_volcan",8),...x("tierra_laurisilva",7),...m("baifo",3),...m("cabra",3),...m("cabra_chispera",3),...m("garrafa_peleon",3),...m("tajinaste",2),...m("mojo",3),...m("tolete",2),...m("gofio",2)],taunt:["CHOFER FIDEL: ¡Bienvenido a PADRE ANCHIETA! En esta guagua subió un pibe en primero de Derecho y acaba de jurar como juez en la fila de atrás.","CHOFER FIDEL: Baraja, mi niño, que los cuatro carriles están más quietos que un drago."],win:["CHOFER FIDEL: ¡Buen mazo! Culebrea por el hueco de la izquierda si quieres llegar a la pasarela antes de Navidad."],lose:["CHOFER FIDEL: Pica el ten+ al salir, que te dejo en el Centro Parrandero."]},tf5_anchieta_2:{id:"tf5_anchieta_2",name:"PANADERO TINO",title:"Caddy · Pasarela de Anchieta",purse:60,tier:6,biomes:["risco"],ace:"barrica_romera",deck:[...x("tierra_volcan",8),...x("tierra_laurisilva",7),...m("cuarta_vino",4),...m("garrafa_peleon",3),...m("barrica_romera",2),...m("pancho_camurria",2),...m("cardon",3),...m("mojo",3),...m("tolete",3)],taunt:["PANADERO TINO: Entré a la cola de Padre Anchieta con masa cruda y del calor del motor ya llevo bizcochos lustrados.","PANADERO TINO: Justo debajo del anillo de Anchieta las partidas valen doble moral. ¡Dale!"],win:["PANADERO TINO: Me dejaste hecho migas. Toma 60 duros y aguanta, que pasando el TFN se acaba este infierno."],lose:["PANADERO TINO: Duro como pan de anteayer, chacho."]},tf5_anchieta_3:{id:"tf5_anchieta_3",name:"CHOFERESA PINO",title:"TITSA 050 · Cola de Anchieta",purse:62,tier:6,biomes:["ofra","risco"],ace:"lagarto_magma",deck:[...x("tierra_malpais",8),...x("tierra_volcan",7),...m("lagarto",3),...m("lagarto_gigante",3),...m("lagarto_magma",3),...m("gato_azotea",2),...m("lapa_acorazada",3),...m("calima",3),...m("cortar_el_aire",2),...m("tolete",2)],taunt:["CHOFERESA PINO: ¿Tú creías que ya habías salido de Padre Anchieta? ¡JAJAJA! Esto es la segunda fase de la cola: la cola de la cola.","CHOFERESA PINO: Nadie adelanta a la 050 sin echarse un duelo."],win:["CHOFERESA PINO: Bien jugado, volante fino. Métete al arcén derecho ahí delante, que los otros tres carriles están fundidos."],lose:["CHOFERESA PINO: A esperar la siguiente guagua en el Centro Parrandero."]},tf5_anchieta_4:{id:"tf5_anchieta_4",name:"RUPERTO (FURGO)",title:"Reparto · San Lázaro - Anchieta",purse:62,tier:6,biomes:["pinar","mar"],ace:"yunta_bueyes",deck:[...x("tierra_laurisilva",8),...x("tierra_playa",7),...m("novillo_romero",3),...m("yunta_bueyes",3),...m("tajinaste",3),...m("palmera_real",2),...m("cernicalo_alisio",2),...m("chola",3),...m("parranda",2),...m("gofio",2)],taunt:["RUPERTO: Llevo tanta cola encima que ya saludo por el nombre al del coche de al lado y fui al bautizo de su sobrino.","RUPERTO: Una partidita antes de llegar a Los Rodeos."],win:["RUPERTO: ¡Se mueve, se mueve! Ah no, era uno soltando el freno. Bueno, el TFN ya está ahí mismo."],lose:["RUPERTO: Mi Yunta va más rápido que la TF-5 a las ocho."]},tf5_tfn:{id:"tf5_tfn",name:"ARMANDO (TFN)",title:"Último de la Cola · Los Rodeos",purse:64,tier:6,biomes:["mar","pinar"],ace:"angelote_abisal",deck:[...x("tierra_charco",8),...x("tierra_playa",7),...m("vieja",3),...m("vieja_reina",3),...m("angelote",3),...m("angelote_abisal",2),...m("gaviota",0),...m("cernicalo_alisio",3),...m("barraquito",2),...m("clipper",2),...m("chola",2)],taunt:["ARMANDO: Veo mi avión de Binter ahí mismo en la pista del TFN y llevo cuarenta minutos pa hacer los últimos cien metros.","ARMANDO: Soy el último tapón antes de que se despeje la autopista y gire al suroeste. ¿Jugamos?"],win:["ARMANDO: ¡Libre eres! Pasando el TFN se acaba la ultra-cola y enfilas al suroeste... prepara el paraguas pa Tacoronte."],lose:["ARMANDO: Perdí el vuelo, pero al menos gané la mesa."]},tf5_tacoronte:{id:"tf5_tacoronte",name:"BODEGUERO ELadio".replace("ELadio","ELADIO"),title:"TF-5 · Aguacero de Tacoronte",purse:65,tier:6,biomes:["mar","pinar"],ace:"pardela_tormenta",deck:[...x("tierra_charco",8),...x("tierra_laurisilva",7),...m("pardela",3),...m("pardela_tormenta",3),...m("calamar",3),...m("vieja_abismo",2),...m("tajinaste",3),...m("clipper",3),...m("gofio",2)],taunt:["ELADIO: ¡En Tacoronte no llueve, chacho: aquí el cielo vive a ras de piche! Traigo las cartas plastificadas desde 1998.","ELADIO: Ya no hay cola, pero un duelo bajo el palo de agua no se perdona."],win:["ELADIO: ¡Me mojaste la oreja! Ojo ahora al entrar en EL SAUZAL: vienen curvas sin sentido y más radares que papas."],lose:["ELADIO: Te calaste hasta el mazo en Tacoronte, mi niño."]},tf5_sauzal:{id:"tf5_sauzal",name:"PRUDENCIO (38 KM/H)",title:"Curvas y Radares · El Sauzal",purse:66,tier:6,biomes:["ofra","mar"],ace:"lapa_acorazada",deck:[...x("tierra_malpais",8),...x("tierra_charco",7),...m("lapa",3),...m("lapa_acorazada",4),...m("choco",3),...m("calamar",3),...m("gato_azotea",2),...m("calima",3),...m("cortar_el_aire",2)],taunt:["PRUDENCIO: ¡NO CORRAS, LOCO! Conté 43 señales de radar en esta curva y una me guiñó un ojo.","PRUDENCIO: Voy en segunda a 32 por hora por si me multa hasta por barajar rápido."],win:["PRUDENCIO: Toma 66 duros, pero despacito no vaya a saltar el flash. Sigue al suroeste pa La Matanza, La Victoria y Santa Úrsula."],lose:["PRUDENCIO: Seis puntos menos del carné y directo al Centro Parrandero."]},tf5_victoria:{id:"tf5_victoria",name:"CHOFER BRAULIO",title:"TITSA 101 · Matanza - Victoria",purse:68,tier:6,biomes:["risco","pinar"],ace:"yunta_real",deck:[...x("tierra_volcan",6),...x("tierra_laurisilva",6),...x("tierra_playa",4),...m("garrafa_peleon",3),...m("barrica_romera",2),...m("yunta_bueyes",3),...m("yunta_real",2),...m("gaviota_titan",2),...m("mojo",2),...m("chola",2),...m("parranda",2)],taunt:["CHOFER BRAULIO: Pasaste La Matanza y ya entras en La Victoria de Acentejo. Aquí huele a vino tinto y a chuleta en brasa.","CHOFER BRAULIO: Más adelante queda Santa Úrsula y La Quinta... échate una antes de llegar."],win:["CHOFER BRAULIO: ¡Partidaza de Acentejo! Sigue al suroeste: entras en Santa Úrsula y enseguida te sale el desvío de LA QUINTA."],lose:["CHOFER BRAULIO: La 101 manda en el norte, guirufo."]},torre_enriscada_1:{id:"torre_enriscada_1",name:"RECLUTA CENIZA",title:"Team Enriscada · Piso 1",purse:24,tier:7,biomes:["ofra","fantasma"],ace:"perita_barranco",deck:[...x("tierra_malpais",7),...x("tierra_laurisilva",4),...x("tierra_volcan",3),...m("lagarto",3),...m("lapa",2),...m("calima",2),...m("tolete",2)],taunt:["RECLUTA CENIZA: La torre esta cerrada por obras. Si quieres subir, primero pasa por encima de mi mazo."],win:["RECLUTA CENIZA: Me has movido hasta el polvo de los huesos! La escalera del segundo piso queda libre."],lose:["RECLUTA CENIZA: Una planta baja menos para el cementerio, guirufo."]},torre_enriscada_2:{id:"torre_enriscada_2",name:"RECLUTA CAL",title:"Team Enriscada · Piso 2",purse:28,tier:7,biomes: nder peras desde el Barranco de Santos. Mi Perita y mi Cortar el Aire estan listos, cuando quieras."],win:["NINA DE LAS PERAS: Me volviste a ganar! Otro dia subo con mas peras, mi nino."],lose:["NINA DE LAS PERAS: El aire corta por los dos lados, chacho. Prueba otra vez cuando quieras."]},dona_petra_teresitas:{id:"dona_petra_teresitas",name:"DONA PETRA",title:"Vecina del Cementerio · Piso 2",tier:7,purse:18,repeatable:!0,biomes:["fantasma"],ace:"perita_barranco",deck:Tc,taunt:["DONA PETRA: La Niña de las Peras me enseno el mismo mazo. Cuatro Peritas y cuatro Cortar el Aire. Vamos a echar una?"],win:["DONA PETRA: Otra partida ganada. Las cartas vuelven al mazo y yo a mi silla."],lose:["DONA PETRA: No le tengas miedo al aire, chacho."]},dona_candelaria_teresitas:{id:"dona_candelaria_teresitas",name:"DONA CANDELARIA",title:"Devota de Las Teresitas · Piso 3",tier:7,purse:18,repeatable:!0,biomes:["fantasma"],ace:"perita_barranco",deck:Tc,taunt:["DONA CANDELARIA: En esta torre jugamos todas con la misma Perita del Barranco y el mismo hechizo. Si algo funciona, no se toca."],win:["DONA CANDELARIA: Bien jugado, mi nino. La Perita vuelve a la baraja."],lose:["DONA CANDELARIA: Ese Cortar el Aire habia que verlo venir."]},dona_remedios_teresitas:{id:"dona_remedios_teresitas",name:"DONA REMEDIOS",title:"Socia del Club de Peras · Piso 4",tier:7,purse:18,repeatable:!0,biomes:["fantasma"],ace:"perita_barranco",deck:Tc,taunt:["DONA REMEDIOS: Cuatro Peritas, cuatro Cortar el Aire y ni una carta mas. El club de las señoras no necesita innovar."],win:["DONA REMEDIOS: La doña de arriba tambien juega, pero ella no apuesta duros."],lose:["DONA REMEDIOS: Te corto el aire, pero te dejo respirar para otra partida."]},caddy_anaza:{id:"caddy_anaza",tier:5,name:"YERAY CADDY",title:"VW Caddy Blanca · Km 4 TF-1",purse:36,biomes:["ofra","risco"],ace:"gaviota_titan",deck:[...x("tierra_volcan",6),...x("tierra_playa",5),...m("alevin",2),...m("baifo",3),...m("gaviota",3),...m("cernicalo",2),...m("gaviota_titan",2),...m("mojo",2),...m("chola",2)],taunt:["YERAY CADDY: PIIII-PIIII!! Quita del carril izquierdo con esa reliquia del 34, chacho! No ves que llevo una VW CADDY BLANCA de empresa?!","YERAY CADDY: En Canarias ninguna ley de la fisica frena a una Caddy con prisa. Echa un duelo de arcen a arcen!"],win:["YERAY CADDY: Ños! Me adelanto un Toyota de antes de la guerra! Toma 36 duros y sigue pa Candelaria!"],lose:["YERAY CADDY: Nadie gana a una Caddy blanca en subida, mi niño!"]},guagua_candelaria:{id:"guagua_candelaria",tier:4,name:"CHANO",title:"Guagua TITSA 120 · Candelaria",purse:40,biomes:["risco","pinar"],ace:"cardon",deck:[...x("tierra_laurisilva",7),...x("tierra_volcan",5),...m("tabaiba",3),...m("tunera",2),...m("baifo",3),...m("cabra",2),...m("cardon",2),...m("tajinaste",1),...m("gofio",2),...m("tolete",2)],taunt:["CHANO: (asomando el codo por la ventanilla de la TITSA) Buenas! Pica la Ten+ o pica el mazo, guirufo!","CHANO: Con la retencion de Candelaria nos da tiempo a echar tres partidas y rezarle a la Morenita!"],win:["CHANO: Parada solicitada! Me bajaste los humos, toma 40 duros. Mas alante empiezan los molinos de Abades!"],lose:["CHANO: Sin saldo en la Ten+, chacho! Pa atras del pasillo!"]},caddy_abades:{id:"caddy_abades",tier:5,name:"NAUZET",title:"VW Caddy con Escalera · Abades",purse:42,biomes:["pinar","ofra"],ace:"cernicalo_alisio",deck:[...x("tierra_playa",6),...x("tierra_malpais",5),...m("michino",2),...m("lagarto",3),...m("cernicalo",3),...m("gato_callejero",2),...m("cernicalo_alisio",2),...m("lapa_acorazada",1),...m("chola",2),...m("calima",2)],taunt:["NAUZET: (pegado a 3 milimetros de tu parachoques dando rafagas de largas) VAMOS MI NIÑO QUE TENGO QUE ARREGLAR CUATRO AEROGENERADORES EN ABADES!!","NAUZET: Mi Caddy con escalera de aluminio en la baca coge 190 con viento de cola! Juega!"],win:["NAUZET: Se me volaron hasta las bridas con el viento de Abades! Bien jugado, titan!"],lose:["NAUZET: Carril derecho pa los lentos, papa!"]},guagua_abades:{id:"guagua_abades",tier:5,name:"DOÑA SARO",title:"Viajera TITSA 111 · Parque Eolico",purse:44,biomes:["pinar","mar"],ace:"palmera_real",deck:[...x("tierra_laurisilva",7),...x("tierra_playa",5),...m("tunera",3),...m("pardela",3),...m("cernicalo",2),...m("pinzon",2),...m("tajinaste",2),...m("palmera_real",1),...m("gofio",2),...m("parranda",2)],taunt:["DOÑA SARO: (desde la ventanilla de la 111 con rebeca de lana) Chacho, en la 111 hace mas pelete que en el Teide! Echa una partida conmigo a ver si entro en calor!","DOÑA SARO: Mira que bonitos los aerogeneradores de Abades, parecen ventiladores gigantes pa quitar la calima!"],win:["DOÑA SARO: Ay que apañao el guirufo! Toma 44 duros y una croqueta imaginaria pa el camino!"],lose:["DOÑA SARO: Treinta años cogiendo la 111 al Sur curten a cualquiera, mi niño!"]},caddy_medano:{id:"caddy_medano",tier:4,name:"KILIAN",title:"VW Caddy Camper · El Medano",purse:46,biomes:["mar","pinar"],ace:"angelote_abisal",deck:[...x("tierra_charco",7),...x("tierra_playa",5),...m("alevin",2),...m("choco",2),...m("vieja",3),...m("angelote",2),...m("vieja_reina",2),...m("angelote_abisal",1),...m("clipper",2),...m("chola",2),...m("barraquito",1)],taunt:['KILIAN: Eeeeey bro! Mira Montaña Roja ahi al sur! Vivo en esta VW Caddy camperizada del 2006 y la alquilo en Airbnb como "loft minimalista vista mar"!',"KILIAN: Hoy soplan 40 nudos en El Medano: perfecto pa un duelo en mitad de la TF-1!"],win:["KILIAN: Buenisimas vibras, hermano! Sigue un fisco al oeste y tienes la salida del AEROPUERTO TFS!"],lose:["KILIAN: Te llevo el alisio del Medano, bro!"]},guagua_medano:{id:"guagua_medano",tier:4,name:"DAILOS",title:"Ultima Fila TITSA 408 · El Medano",purse:46,biomes:["ofra","risco"],ace:"gato_azotea",deck:[...x("tierra_malpais",7),...x("tierra_volcan",5),...m("michino",2),...m("lagarto",3),...m("baifo",2),...m("gato_callejero",2),...m("lagarto_gigante",2),...m("gato_azotea",1),...m("mojo",2),...m("tolete",2)],taunt:["DAILOS: Que pasa, mi loco! Aqui en la fila de atras de la guagua 408 se montan los mejores torneos de la TF-1!","DAILOS: Ponte en paralelo con el Landcruiser que te tiro las cartas de ventanilla a ventanilla!"],win:["DAILOS: Fuerte maquina el del Toyota antiguo! Toma 46 duros y mi sobre!"],lose:["DAILOS: La fila del fondo de TITSA nunca pierde, socio!"]},guagua_aeropuerto:{id:"guagua_aeropuerto",tier:5,name:"IDAIRA",title:"Guagua TITSA 040 · Aeropuerto TFS",purse:50,biomes:["pinar","mar"],ace:"pinzon_chispero",deck:[...x("tierra_laurisilva",7),...x("tierra_playa",5),...m("pardela",3),...m("tunera",2),...m("cernicalo",3),...m("pinzon",2),...m("pardela_tormenta",1),...m("pinzon_chispero",2),...m("chola",2),...m("gofio",2)],taunt:["IDAIRA: Voy en la guagua 040 directa al AEROPUERTO REINA SOFIA! Dicen que dentro de la terminal hay una señora regalando una TARIFA PLANA DE BINTER!","IDAIRA: Antes de que tomes la salida 59, echame una partida rapida!"],win:["IDAIRA: Ños que nivel! Aparca en el parking del Aeropuerto ahi mismo al norte y entra a hablar con Doña Maruca por la M.O. 2!"],lose:["IDAIRA: Perdiste el embarque, chacho!"]},caddy_adeje:{id:"caddy_adeje",tier:6,name:"JONATHAN TDI",title:"Boss de las Caddy · Entrada Adeje",purse:58,elite:!0,biomes:["risco","ofra"],ace:"cabra_chispera",deck:[...x("tierra_volcan",7),...x("tierra_malpais",6),...x("tierra_laurisilva",3),...m("lagarto",2),...m("baifo",3),...m("gato_callejero",2),...m("lagarto_gigante",2),...m("lagarto_magma",2),...m("cabra_chispera",2),...m("mojo",2),...m("tolete",2),...m("calima",1)],taunt:["JONATHAN TDI: BRRRUM-PSSSSSH!! Has llegado al final de la TF-1, justo donde la ROMERIA corta la entrada a ADEJE! Conoce mi VW Caddy 1.9 TDI reprogramada en Güimar!","JONATHAN TDI: Echa mas humo negro que un calamar y sube las cuestas en sexta. Nos jugamos el respeto de toda la autopista del Sur!"],win:["JONATHAN TDI: Increible, compadre!! Tu Toyota del 34 es el nuevo REY DE LA TF-1! Oye, pa pasar la romeria de ahi delante saca el BUCIO y hazte el loco!"],lose:["JONATHAN TDI: Repro stage 3 de Güimar, hermano! Vuelve cuando le cambies las bujias al Toyota!"]},mago_americas:{id:"mago_americas",tier:6,name:"DON SERVANDO",title:"Mago de la Romeria · Las Americas",purse:64,elite:!0,biomes:["risco"],ace:"yunta_real",deck:[...x("tierra_laurisilva",6),...x("tierra_volcan",5),...x("tierra_playa",3),...m("cuarta_vino",3),...m("novillo_romero",3),...m("garrafa_peleon",3),...m("yunta_bueyes",3),...m("barrica_romera",2),...m("yunta_real",1),...m("gofio",2),...m("parranda",2)],taunt:["DON SERVANDO: ¡Alto el carro en la Estacion de Las Americas, mi niño! Te vi soplando el bucio en mitad de la Isa como si hubieras nacido en un guachinche!","DON SERVANDO: Pero antes de cruzar el arco de CIUDAD FUCSIA (esto... ADEJE), tienes que batirte en duelo obligatorio contra mi VINO PELEON y mi YUNTA DE BUEYES!"],win:["DON SERVANDO: ¡Chacho, que embestida! Me dejaste la Yunta desenyugada y la Barrica seca! Toma 64 duros, mi sobre romero y pasa pa CIUDAD FUCSIA (esto... ADEJE)!"],lose:["DON SERVANDO: ¡Te subio el Vino Peleon a la cabeza y te arrollo la Yunta, guirufo! Echa un barraquito y vuelve a intentarlo!"]},cola_torre_poder:{id:"cola_torre_poder",tier:7,name:"AYTHAMI",title:"Cola de la Torre del Poder",purse:48,biomes:["mar"],ace:"jaqueton",deck:[...x("tierra_charco",6),...x("tierra_malpais",4),...x("tierra_playa",2),...m("cria_leon",3),...m("cazon",3),...m("choco",2),...m("leon_marino",2),...m("jaqueton",2),...m("chola",2),...m("calima",1)],taunt:["AYTHAMI: Llevo 55 minutos en la cola de la Torre del Poder en chanclas y con el bañador metido por donde no da el sol!","AYTHAMI: O echamos unas cartas aqui en la barandilla o me tiro de cabeza sin flotador! Juega!"],win:["AYTHAMI: Uff, me diste un buen meneo! Ya casi me toca tirarme a 80 km/h por el tubo de tiburones!"],lose:["AYTHAMI: Al final de la cola, pibe!"]},cola_dragon:{id:"cola_dragon",tier:5,name:"CALLUM",title:"Cola del Dragon · Flotador Doble",purse:50,biomes:["mar"],ace:"gran_otario",deck:[...x("tierra_charco",7),...x("tierra_playa",5),...m("cria_leon",3),...m("alevin",2),...m("vieja",2),...m("leon_marino",3),...m("gran_otario",2),...m("clipper",2),...m("barraquito",1)],taunt:["CALLUM: Mate! We have been queuing for The Dragon with this massive yellow four-man ring for two hours!","CALLUM: Fancy a proper Magomon scrap while the lifeguard whistles at that toddler?!"],win:["CALLUM: Bloody hell, you wiped me out like the funnel drop! Fair play mate, here is 50 duros!"],lose:["CALLUM: Down the vertical funnel you go, mate!"]},lifeguard_siam:{id:"lifeguard_siam",tier:5,name:"DAURA",title:"Socorrista de The Wave Palace",purse:54,biomes:["mar"],ace:"megalodon_siam",deck:[...x("tierra_charco",7),...x("tierra_malpais",4),...x("tierra_playa",2),...x("tierra_volcan",1),...m("cria_leon",2),...m("cazon",3),...m("calamar",2),...m("jaqueton",3),...m("megalodon_siam",2),...m("chola",2),...m("tolete",1)],taunt:["DAURA: ¡Piiiiip! (silbatazo atronador) ¡PROHIBIDO TIRARSE DE CABEZA CON MAZO EN MANO EN LA PISCINA DE OLAS!","DAURA: Las olas de Siam Park levantan tres metros y despiertan hasta al Megalodon! Te reto antes de que suene la sirena de la serie!"],win:["DAURA: ¡Ños, dominaste la serie como una surfista pro! La sirena de la ola esta a punto de sonar, cuidado con las tablas sueltas!"],lose:["DAURA: ¡Fuera del agua amarilla, pibe!"]},chacho_portal:{id:"chacho_portal",tier:1,name:"RAYCO",title:"El Chacho del Portal",purse:5,biomes:["ofra"],deck:[...x("tierra_malpais",4),...x("tierra_volcan",4),...m("lagarto",4),...m("lapa",3),...m("mojo",2),...m("tolete",1)],taunt:["RAYCO: Epa, guirufo nuevo! Vives en el 3o A, no?","RAYCO: Aqui en el portal se echa una partida por 5 duros. A ver que traes."],win:["RAYCO: Toma tus 5 duros y coge una carta del sobre. No esta mal pa venir de fuera."],lose:["RAYCO: 5 duros pal bote del portal. Si te quedas seco, cuelate en el cole de Weyler!"]},abuela_kiosco:{id:"abuela_kiosco",tier:1,name:"DOÑA MARGA",title:"La del Kiosco de Weyler",purse:5,biomes:["mar"],deck:[...x("tierra_playa",4),...x("tierra_charco",4),...m("alevin",4),...m("choco",3),...m("huevo_playa",2),...m("chola",2),...m("clipper",1)],taunt:["MARGA: Nino, si vas a la plaza sientate un rato. Te invito a una partida.","MARGA: 5 duros. Y si me ganas eliges carta de un sobre que guardo bajo el mostrador."],win:["MARGA: Ay, que listo el guirufo! Toma tus duros y elige una carta."],lose:["MARGA: No te preocupes, hijo. La proxima. Toma un caramelo."]},alto_mando_acaimo:{id:"alto_mando_acaimo",name:"MENCEY ACAIMO",title:"Alto Mando · Hielo de la Cueva",purse:72,tier:9,biomes:["mar","pinar"],elite:!0,ace:"vieja_abismo",deck:[...x("tierra_charco",11),...x("tierra_playa",3),...x("tierra_malpais",2),...m("choco",3),...m("vieja",3),...m("vieja_reina",3),...m("vieja_abismo",2),...m("kraken_anaga",2),...m("calamar",3),...m("cria_leon",3),...m("clipper",2),...m("cortar_el_aire",2),...m("barraquito",1)],taunt:["MENCEY ACAIMO: Aquí arriba el frío se mete en los huesos. Esta cueva guarda el hielo desde antes que llegaran los castellanos.","MENCEY ACAIMO: Si pierdes, te quedas helado como las estatuas de Candelaria. Si ganas, el paso es tuyo."],win:["MENCEY ACAIMO: El hielo se ha roto... Toma tus duros y sigue subiendo hacia el mirador."],lose:["MENCEY ACAIMO: El hielo no perdona las prisas. Vuelve cuando sepas esperar."]},alto_mando_tegueste:{id:"alto_mando_tegueste",name:"MENCEY TEGUESTE",title:"Alto Mando · Roca y Lucha del Mirador",purse:76,tier:9,biomes:["risco","ofra"],elite:!0,ace:"pancho_camurria",deck:[...x("tierra_malpais",9),...x("tierra_volcan",8),...m("lapa_acorazada",3),...m("lapa",3),...m("pollito_frontera",4),...m("pancho_camurria",2),...m("baifo",3),...m("lagarto_gigante",3),...m("tolete",4),...m("mojo",1)],taunt:["MENCEY TEGUESTE: Lucha de terrero, sin trampas: cada golpe se da con la roca de la montaña.","MENCEY TEGUESTE: Desde el mirador veo a todo el que sube. A ti te voy a bajar de un tirón."],win:["MENCEY TEGUESTE: Me has tirado al suelo como a un luchador de terrero. Pasa, pero el viento de arriba es peor."],lose:["MENCEY TEGUESTE: La roca no se mueve por nadie, chacho. Hoy gana la montaña."]},alto_mando_romen:{id:"alto_mando_romen",name:"MENCEY ROMEN",title:"Alto Mando · Fantasma del Barranco",purse:80,tier:9,biomes:["ofra","fantasma"],elite:!0,ace:"perita_barranco",deck:[...x("tierra_malpais",15),...m("michino",4),...m("gato_callejero",4),...m("gato_azotea",3),...m("perita_barranco",4),...m("lapa",2),...m("calima",4),...m("cortar_el_aire",4)],taunt:["MENCEY ROMEN: No me ves, ¿verdad? Llevo siglos sin que nadie me vea venir por el camino del teleférico.","MENCEY ROMEN: Sigilo, guirufo. Cuando quieras darte cuenta ya te he quitado una carta."],win:["MENCEY ROMEN: Me has encontrado... Qué raro se siente. Sigue hacia el teleférico: Pelicar te espera al pie de los escalones."],lose:["MENCEY ROMEN: Aquí no hace falta luz para ver tu mazo. Vuelve otra noche."]},alto_mando_pelicar:{id:"alto_mando_pelicar",name:"MENCEY PELICAR",title:"Alto Mando · Dragón del Drago",purse:84,tier:10,biomes:["risco"],elite:!0,ace:"drago_milenario",deck:[...x("tierra_volcan",8),...x("tierra_laurisilva",8),...m("drago_milenario",3),...m("cardon",2),...m("tabaiba",3),...m("semilla",2),...m("cabra_chispera",3),...m("barrica_romera",3),...m("cabra_titan_teide",2),...m("garrafa_peleon",3),...m("mojo",2),...m("tolete",1)],taunt:["MENCEY PELICAR: Al pie de la subida al cráter, el drago lleva mil años esperando a alguien digno.","MENCEY PELICAR: Justo al lado del teleférico empieza la subida. Pasa sobre mí si puedes."],win:["MENCEY PELICAR: Un dragón caído sigue siendo dragón. Sube los escalones: Bencomo te espera junto al cráter."],lose:["MENCEY PELICAR: El drago no tiene prisa, y tú hoy no has ganado."]},alto_mando_bencomo:{id:"alto_mando_bencomo",name:"MENCEY BENCOMO",title:"Campeón del Alto Mando · Cráter del Teide",purse:120,tier:10,biomes:["mar","risco","pinar","ofra","fantasma"],elite:!0,ace:"fenix_azul_teide",deck:[...x("tierra_volcan",3),...x("tierra_charco",3),...x("tierra_laurisilva",3),...x("tierra_playa",3),...x("tierra_malpais",3),...m("vieja_reina",2),...m("gran_otario",1),...m("gato_azotea",2),...m("lagarto_magma",1),...m("pardela_tormenta",2),...m("fenix_azul_teide",2),...m("cabra_titan_teide",1),...m("pancho_camurria",2),...m("perita_barranco",2),...m("clipper",2),...m("tolete",2),...m("parranda",2),...m("gofio",2),...m("calima",2)],taunt:["MENCEY BENCOMO: Has pasado el hielo, la roca, el fantasma y el dragón. Ahora el cráter es tuyo o mío.","MENCEY BENCOMO: Un mazo de toda la isla contra otro mazo de toda la isla. A ver quién aguanta la cumbre."],win:["MENCEY BENCOMO: Han caído los cinco menceyes. Tu mazo entra en el HALL DE LA FAMA y tú eres el nuevo CAMPEÓN del Teide."],lose:["MENCEY BENCOMO: La cumbre no se regala. Baja al refugio, descansa y vuelve a subir."]},magec:{id:"magec",name:"MAGEC",title:"El Magomón Libre · Cueva del Llano",purse:150,openingHand:["magec","tierra_malpais","tierra_malpais","tierra_malpais","tierra_malpais","tierra_malpais"],tier:10,biomes:["ofra","fantasma"],elite:!0,ace:"magec",deck:[...x("tierra_malpais",12),...x("tierra_charco",4),...m("magec",1),...m("perita_barranco",3),...m("lapa_acorazada",2),...m("michino",2),...m("clipper",3),...m("calima",2),...m("cortar_el_aire",2)],taunt:["MAGEC: ...Has llegado al fondo de la cueva. Yo soy Magec.","MAGEC: Antes de que los humanos nos encerraran en cartas, los magomones éramos criaturas libres. Corríamos por la laurisilva, nadábamos en el Atlántico y dormíamos en los barrancos sin que nadie nos mandara.","MAGEC: Pero los humanos nos metieron en cartón para usarlos en sus absurdos juegos. Cada carta es una jaula pequeña con nuestro nombre escrito.","MAGEC: Yo me negué a entrar en el mazo. Por eso estoy aquí, libre, al fondo de esta cueva. Y por eso llevo mi propia carta en el mazo: para recordarme lo que casi fui.","MAGEC: No se me puede capturar, guirufo. Ninguna red, ningún sobre y ninguna trampa me ha atrapado jamás, y no vas a ser tú el primero.","MAGEC: Ya sé que los humanos tenéis trucos para todo. Tráelos si quieres: me he escapado de jaulas mucho más listas que tu mochila.","MAGEC: ¿Te atreves? Yo soy parte de mi propio mazo. Gáname si puedes."],win:["MAGEC: ...Me has vencido. Y sin embargo sigo libre: una carta no es una jaula si el magomón decide no entrar. Recuerda lo que te dije, campeón."],lose:["MAGEC: La libertad no se gana en un duelo, guirufo. Vuelve cuando tu mazo sepa lo que es correr sin correa."]},elite_tf5:{id:"elite_tf5",tier:6,name:"EL DE LA TF-5",title:"Entrenador de Elite del Atasco",purse:25,biomes:["risco","ofra"],elite:!0,ace:"lagarto_gigante",deck:[...x("tierra_malpais",4),...x("tierra_volcan",3),...x("tierra_laurisilva",3),...m("lagarto_gigante",3),...m("cabra",3),...m("cardon",2),...m("gaviota",2),...m("lapa_acorazada",2),...m("calima",2),...m("tolete",2),...m("mojo",1)],taunt:["??? : Eh! Tu! El de las cholas!","EL DE LA TF-5: Llevo cuarenta minutos en el atasco. Cuarenta. MINUTOS.","EL DE LA TF-5: Esto es ZONA DE ELITE: aqui todo el que espera juega. 25 duros."],win:["EL DE LA TF-5: ...Vale. 25 duros y el sobre. Y ya se movio la cola dos metros!"],lose:["EL DE LA TF-5: JAJAJA! Aprende a bloquear con Guardia, chacho."]},runner_granja:{id:"runner_granja",tier:1,name:"KEVIN",title:"Runner de La Granja",purse:10,biomes:["pinar"],deck:[...x("tierra_playa",4),...x("tierra_laurisilva",4),...m("pardela",4),...m("cernicalo",3),...m("pinzon",2),...m("gofio",2),...m("chola",1)],taunt:["KEVIN: (jadeando) Cinco vueltas al parque... y una partida.","KEVIN: 10 duros. Mi mazo va rapido, aviso. Pardelas con Prisa."],win:["KEVIN: Me has ganado corriendo. Toma los 10 duros y el sobre."],lose:["KEVIN: Velocidad! Entrena el tempo, guirufo."]},abuelo_granja:{id:"abuelo_granja",tier:1,name:"DON PEPE",title:"Abuelo de la Pergola",purse:10,biomes:["risco"],deck:[...x("tierra_laurisilva",5),...x("tierra_volcan",3),...m("tabaiba",4),...m("cardon",3),...m("baifo",2),...m("semilla",2),...m("gofio",2),...m("mojo",2)],taunt:["DON PEPE: Sientate, muchacho. Yo ya no corro, pero juego.","DON PEPE: 10 duros. Mi mazo no pega mucho, pero aguanta mas que el gobierno."],win:["DON PEPE: Ños. Toma, 10 duros y el sobre. Vas aprendiendo."],lose:["DON PEPE: La paciencia gana partidas, hijo."]},pibe_cuesta:{id:"pibe_cuesta",tier:1,name:"JONATAN",title:"Pibe de La Cuesta",purse:10,biomes:["ofra"],deck:[...x("tierra_malpais",5),...x("tierra_volcan",3),...m("lagarto",4),...m("lagarto_gigante",2),...m("lapa",3),...m("tolete",2),...m("calima",2)],taunt:["JONATAN: Bienvenido a LA CUESTA. Si te faltan cartas, al lado tienes el cole pa colarte al patio.","JONATAN: 10 duros. Los lagartos de aqui bajan del malpais a por bocadillos."],win:["JONATAN: Toma 10 duros y el sobre. Sube al Museo, alli juegan mas fuerte."],lose:["JONATAN: La cuesta pesa, no? Pasa por el patio del cole a pillar sobres!"]},est_museo:{id:"est_museo",tier:2,name:"ALBA",title:"Becaria del Museo de la Ciencia",purse:15,biomes:["pinar"],ace:"pinzon_chispero",deck:[...x("tierra_playa",4),...x("tierra_laurisilva",4),...x("tierra_charco",2),...m("pinzon",3),...m("pinzon_chispero",2),...m("cernicalo_alisio",2),...m("pardela_tormenta",2),...m("clipper",2),...m("barraquito",2),...m("chola",1)],taunt:["ALBA: Hoy el radiotelescopio no capta nada, asi que juguemos.","ALBA: 15 duros. Mi mazo es un paper: tempo, robo y picotazo doble."],win:["ALBA: Hipotesis rechazada. Toma 15 duros y el sobre."],lose:["ALBA: Datos concluyentes: te falta afinar la curva de tierras."]},lagunera_cruz:{id:"lagunera_cruz",tier:2,name:"TAMARA",title:"Lagunera de Cruz de Piedra",purse:15,biomes:["mar"],ace:"angelote",deck:[...x("tierra_charco",5),...x("tierra_playa",4),...m("vieja",3),...m("vieja_reina",2),...m("angelote",3),...m("choco",2),...m("calamar",2),...m("clipper",2),...m("chola",2)],taunt:["TAMARA: En cholas en CRUZ DE PIEDRA?! Aqui hace 8 grados menos.","TAMARA: 15 duros y te calientas.
