purple-600",glow:"shadow-violet-500/30",tag:"TECH DEBT",dialogue:"Llevo 3 semanas durmiendo 4h. O contratamos 2 devs senior YA, o el monolito explota y reescribo todo en Rust por despecho. Tú decides, 'CEO'.",left:{label:"Contratar refuerzos",sub:"-$60k pero salvas el producto",effect:{vcs:-4,ventas:0,producto:16,cultura:10,cash:-60},result:"Contrataste a dos seniors. El deploy del viernes no tumbó prod. Javi lloró de felicidad."},right:{label:"'Aguanta un sprint más'",sub:"Pizza y promesas gratis",effect:{vcs:2,ventas:3,producto:-14,cultura:-12,cash:0},result:"Javi actualizó LinkedIn a 'Open to work'. El bug en pagos costó 400 clientes. Bien jugado."}},{id:"enterprise-client",name:"Margarita Solís",role:"CIO",org:"Banco Enorme S.A.",emoji:"🏦",gradient:"from-sky-400 via-blue-500 to-indigo-600",glow:"shadow-blue-500/30",tag:"ENTERPRISE",dialogue:"Nos encanta vuestra demo. Firmamos $120k anuales... si hacéis SSO, SOC2, on-premise, fax y una feature que solo usamos nosotros. Para ayer, porfa.",left:{label:"Decir SÍ a todo",sub:"El cliente siempre manda",effect:{vcs:6,ventas:18,producto:-12,cultura:-8,cash:120,soul:-3},result:"Firmaste. Ventas se dispara. Producto ahora es un Frankenstein con soporte para fax."},right:{label:"Mantener el roadmap",sub:"Focus, focus, focus",effect:{vcs:-4,ventas:-10,producto:12,cultura:6,cash:0},result:"Margarita se fue a Oracle. Tu roadmap sigue puro. Tu cuenta, vacía de enterprise."}},{id:"growth-hacker",name:"Luna Viral",role:"Head of Growth",org:"Ex-TikTok, 400k seguidores",emoji:"🚀",gradient:"from-pink-400 via-fuchsia-500 to-purple-600",glow:"shadow-pink-500/30",tag:"GROWTH",dialogue:"Tengo el plan: sorteamos un Tesla entre usuarios, spam en LinkedIn y un pop-up que no se puede cerrar. Growth 300% garantizado*. (*no garantizado). ¿Lo lanzo?",left:{label:"Lanzar el growth hack",sub:"Números go brrr",effect:{vcs:8,ventas:14,producto:-6,cultura:-6,cash:-25},result:"10k signups en 48h. El 98% eran cazateslas. Tu NPS ahora es un número ne "from-fuchsia-300 via-pink-400 to-rose-500",glow:"shadow-pink-400/30",tag:"SOCIOS",dialogue:"Oye, tenemos que hablar. Estoy al 150% y mi equity no refleja mi curro. O reequilibramos el cap table o me voy a montar 'lo mismo pero sin ti'. Con amor, ¿eh?",left:{label:"Darle más equity",sub:"Lo justo es lo justo",effect:{vcs:-6,ventas:2,producto:6,cultura:16,cash:0},result:"Le diste 8% más. Llorasteis y os abrazasteis. El equipo lo celebró como una boda."},right:{label:"'El equity ya está hablado'",sub:"Mano dura",effect:{vcs:4,ventas:-4,producto:-12,cultura:-16,cash:0,soul:-5},result:"Marta no dijo nada. Solo actualizó su LinkedIn. El silencio en la ofi se puede cortar."}},{id:"consultor",name:"Gonzalo Deck",role:"Ex-McKinsey",org:"Slides & Synergies",emoji:"📊",gradient:"from-blue-300 via-indigo-400 to-violet-600",glow:"shadow-indigo-400/30",tag:"STRATEGY",dialogue:"He analizado vuestra startup en un deck de 120 slides. Conclusión: necesitáis 'sinergizar el flywheel paradigmático'. Son $40k. El deck es precioso, eso sí.",left:{label:"Contratar al consultor",sub:"Slides que impresionan VCs",effect:{vcs:10,ventas:-2,producto:-4,cultura:-8,cash:-40,soul:-2},result:"Los VCs amaron el deck. El equipo lo usa como meme. 'Sinergizar' ya es verbo interno."},right:{label:"Echarle con cajas destempladas",sub:"Hacemos, no slideamos",effect:{vcs:-5,ventas:2,producto:5,cultura:8,cash:0},result:"Gonzalo se fue ofendidísimo. El equipo aplaudió. Shippeasteis en lo que él tardaba en alinear un texto."}},{id:"openai-bill",name:"Factura de OpenAI",role:"Tu mayor gasto después de nóminas",org:"AI API Billing",emoji:"🤖",gradient:"from-green-300 via-teal-400 to-cyan-600",glow:"shadow-teal-400/30",tag:"COSTES",minEra:2,dialogue:"Hola, soy vuestra factura de IA: $28k este mes porque alguien puso GPT-4 para resumir emojis. Podéis optimizar con caching... o seguir quemando cash como si fuerais OpenAI.",left:{label:"Optimizar y cachear",sub:"Ingeniería de costes",effect:{vcs:3,ventas:0,producto:8,cultura:-2,cash:15},result:"Optimizaste prompts y cache. Ahorro real. El CTO te debe una caña."},right:{label:"'La calidad no se recorta'",sub:"GPT-4 para todo",effect:{vcs:-2,ventas:3,producto:6,cultura:2,cash:-28},result:"La demo vuela. La factura también. Tu CFO (tú) llora en posición fetal."}},{id:"devops",name:"Kuberto Iglesias",role:"DevOps / SRE",org:"El que sabe dónde está prod",emoji:"☸️",gradient:"from-cyan-300 via-blue-400 to-indigo-600",glow:"shadow-blue-400/30",tag:"INFRA",dialogue:"Propongo migrar TODO a Kubernetes multi-región con service mesh e Istio. Tardamos 3 semanas sin features. Pero podremos escalar a... eh... millones. ¿Algún día?",left:{label:"Aprobar la migración",sub:"Escalabilidad infinita",effect:{vcs:5,ventas:-6,producto:10,cultura:-4,cash:-22},result:"3 semanas de infierno YAML. Ahora escaláis a millones. Tenéis 4.000 usuarios. Pero listos."},right:{label:"'Heroku aguanta, ¿no?'",sub:"Keep it simple",effect:{vcs:-3,ventas:3,producto:-6,cultura:3,cash:0},result:"Seguís en el monolito feliz. Kuberto murmura 'deuda técnica' cada vez que pasas."}},{id:"websummit",name:"Paddy Speaker",role:"Organizador de eventos",org:"Web Summit Clon Lisboa",emoji:"🎤",gradient:"from-purple-300 via-violet-400 to-indigo-600",glow:"shadow-violet-400/30",tag:"HYPE",dialogue:"¡Os queremos en el escenario principal! Solo $15k por el stand + vuestro CTO en un panel a las 8AM + repartir 2.000 tote bags. Exposure brutal, lo juro.",left:{label:"Ir a por el hype",sub:"Fotos con grúa y tote bags",effect:{vcs:9,ventas:8,producto:-3,cultura:4,cash:-15},result:"Foto con 3 unicornios y 40 leads. LinkedIn ardiendo. Valió cada tote bag."},right:{label:"Quedarse picando código",sub:"Anti-hype",effect:{vcs:-6,ventas:-4,producto:9,cultura:-2,cash:0},result:"Mientras otros hacían networking, shippeaste. Nadie lo sabe. Pero el producto lo nota."}},{id:"angel",name:"Don Emilio",role:"Business Angel excéntrico",org:"Hizo fortuna con parking en Marbella",emoji:"🕶️",gradient:"from-amber-200 via-yellow-300 to-orange-500",glow:"shadow-yellow-300/30",tag:"ANGEL",dialogue:"Mira, chaval, no entiendo qué hacéis, pero mi nieto dice que la 'IA esa' es el futuro. Te pongo $100k si me prometes que no es como el Forex y me invitas al palco.",left:{label:"Aceptar sus $100k",sub:"Dinero sin preguntas raras",effect:{vcs:-4,ventas:2,producto:2,cultura:6,cash:100},result:"Wire recibido con concepto 'para los ordenadores'. Don Emilio ahora va a todos los afterworks. Es un crack."},right:{label:"Rechazar por 'fit estratégico'",sub:"Solo smart money",effect:{vcs:6,ventas:-2,producto:0,cultura:-4,cash:0},result:"Quedaste de snob. Los VCs pijos aplauden. Tu cuenta llora."}},{id:"happiness",name:"Zoe Zen",role:"Chief Happiness Officer",org:"People & Vibes",emoji:"🧘",gradient:"from-emerald-200 via-green-300 to-teal-500",glow:"shadow-green-300/30",tag:"PEOPLE",dialogue:"El eNPS ha caído a 12. La gente está quemada. Propongo semana de 4 días durante un mes + presupuesto de terapia + prohibir Slack después de las 19h. ¿Cuidamos a la tribu?",left:{label:"Cuidar a la tribu",sub:"People first",effect:{vcs:-5,ventas:-3,producto:4,cultura:17,cash:-14},result:"eNPS a 68 en un mes. La gente vuelve a reír en standup. Hasta Javi sonríe."},right:{label:"'Estamos en guerra, no en un spa'",sub:"Modo espartano",effect:{vcs:4,ventas:5,producto:-6,cultura:-15,cash:0},result:"Zoe dimitió con una carta preciosa y devastadora. 3 devs la siguen en LinkedIn. Mal rollo."}},{id:"ministerio",name:"Funcionario García",role:"Ventanilla 4, Ministerio",org:"Administración Pública",emoji:"🏛️",gradient:"from-gray-300 via-slate-400 to-gray-600",glow:"shadow-gray-400/30",tag:"BUROCRACIA",dialogue:"Para la subvención ENISA de $80k necesitan el modelo 036, el 037, certificado digital, vida laboral, y este formulario... en papel. Por triplicado. Y volved el martes. O el jueves.",left:{label:"Pelear el papeleo",sub:"Dinero público, dolor privado",effect:{vcs:2,ventas:0,producto:-5,cultura:-5,cash:80},result:"Tras 11 visitas, ¡conseguido! $80k que saben a gloria y a tinta de tampón."},right:{label:"'No tenemos tiempo para esto'",sub:"Pasar de subvenciones",effect:{vcs:-2,ventas:2,producto:6,cultura:3,cash:0},result:"Recuperaste 3 semanas de vida. Perdiste $80k. El funcionario selló algo con satisfacción."}},{id:"ex-empleado",name:"Ex-empleado resentido",role:"Glassdoor Reviewer Pro",org:"Ahora en la competencia",emoji:"😤",gradient:"from-stone-400 via-neutral-500 to-zinc-700",glow:"shadow-zinc-500/30",tag:"DRAMA",dialogue:"Voy a publicar en Glassdoor que aquí se trabaja 60h, el CEO grita y la máquina de café echa humo. A menos que... me des una buena referencia y $5k de 'finiquito emocional'.",left:{label:"Pagar y callar",sub:"-$5k de paz",effect:{vcs:0,ventas:0,producto:0,cultura:8,cash:-5},result:"Pagaste. La review fue de 4 estrellas: 'intenso pero aprendí mucho'. Barato."},right:{label:"Llamar a su farol",sub:"No negociamos con chantajes",effect:{vcs:-7,ventas:-6,producto:0,cultura:-10,cash:0},result:"Publicó la review de 1 estrella. 47 comentarios. Hiring congelado 2 semanas. Ay."}},{id:"bigtech-offer",name:"Recruiter de Meta",role:"Talent Hunter",org:"Big Tech con campus y helados gratis",emoji:"🍦",gradient:"from-blue-400 via-cyan-400 to-teal-500",glow:"shadow-cyan-400/30",tag:"TENTACIÓN",dialogue:"Hola crack, te ofrecemos $280k + bonus + helado gratis para que dejes tu 'proyectito' y vengas a optimizar el botón de 'me gusta'. Tu equipo ni se enterará... al principio.",left:{label:"Quedarte y liderar",sub:"Founder hasta la muerte",effect:{vcs:5,ventas:2,producto:5,cultura:12,cash:0,soul:2},result:"Contaste la oferta en el all-hands. 'Me quedo con vosotros'. Ovación. Alguien lloró."},right:{label:"Tentar la oferta (un poco)",sub:"Entrevistarte en secreto",effect:{vcs:-6,ventas:-3,producto:-8,cultura:-12,cash:0,soul:-3},result:"El equipo se enteró por un leak. La confianza tardará en volver. El helado no valía tanto."}},{id:"cliente-viral",name:"Ibai (no, otro Ibai)",role:"Streamer, 2M followers",org:"Twitch / TikTok",emoji:"🎮",gradient:"from-violet-400 via-purple-500 to-indigo-600",glow:"shadow-purple-500/30",tag:"VIRAL",dialogue:"¡Gente! Vuestra app es GOD. La uso en directo mañana si me dais premium de por vida y un código 'IBAICITO10' con el que me llevo el 30%. ¿Deal o sois NPCs?",left:{label:"Firmar con el streamer",sub:"A por lo viral",effect:{vcs:7,ventas:16,producto:-3,cultura:3,cash:-10},result:"50k visitas en una noche. Servidores temblando. Ventas en vertical. GG."},right:{label:"Mantener pricing serio",sub:"No somos un casino",effect:{vcs:-2,ventas:-7,producto:4,cultura:0,cash:0},result:"Se fue a promocionar a tu competidor. Su raid de 80k viewers... duele verlo."}},{id:"auditor-soc2",name:"Auditora SOC2",role:"La pesadilla enterprise",org:"Compliance & Doom",emoji:"🔍",gradient:"from-slate-400 via-gray-500 to-zinc-600",glow:"shadow-gray-500/30",tag:"COMPLIANCE",dialogue:"Para cerrar con enterprises necesitáis SOC2 Tipo II: 4 meses de evidencias, políticas y logs de todo. Sin esto, ni un banco os mira. ¿Empezamos el infierno?",left:{label:"Empezar la certificación",sub:"Dolor enterprise necesario",effect:{vcs:9,ventas:8,producto:-6,cultura:-6,cash:-30},result:"Infierno de screenshots y políticas. Pero ahora puedes decir 'somos SOC2' y los CISOs sonríen."},right:{label:"Pasar por ahora",sub:"Mover rápido",effect:{vcs:-7,ventas:-7,producto:5,cultura:3,cash:0},result:"Ahorraste meses. Perdiste 2 deals enterprise que pedían el papelito. La vida es tradeoff."}},{id:"cofounder-ia",name:"Tu propio Product Hunt",role:"Lanzamiento del día",org:"Product Hunt #1?",emoji:"🏆",gradient:"from-yellow-300 via-orange-400 to-red-500",glow:"shadow-orange-400/30",tag:"LAUNCH",dialogue:"Sois #3 en Product Hunt. Si spameáis a toda vuestra red las próximas 6h podéis ser #1 y salir en todos los newsletters. Pero quemaréis a todo el equipo hoy.",left:{label:"Push total por el #1",sub:"Todo al lanzamiento",effect:{vcs:10,ventas:12,producto:-5,cultura:-9,cash:5},result:"#1 DEL DÍA. Badge naranja eterno. 8k visitas. El equipo duerme desde entonces."},right:{label:"Celebrar el #3 con calma",sub:"Sano y sostenible",effect:{vcs:-2,ventas:2,producto:5,cultura:7,cash:0},result:"#3 con dignidad. Menos hype, más sueño. El producto lo agradeció."}}],r1={id:"google-opa",name:"Elena Vidal",role:"VP CorpDev",org:"Google — Mountain View",emoji:"🔍",gradient:"from-blue-400 via-red-400 to-yellow-300",glow:"shadow-yellow-300/50",tag:"OPA GOOGLE",dialogue:"Hola, founder. Llevamos meses mirándoos. Tres días seguidos por encima del umbral, tracción, producto, cultura... Larry lo ha visto. Queremos compraros por $1.400 millones. Firma aquí y entras en la historia.",left:{label:"VENDER A GOOGLE",sub:"Exit de $1.400 millones. Leyenda.",effect:{vcs:0,ventas:0,producto:0,cultura:0,cash:0},result:"FIRMADO. $1.400M. Portada de todos lados. Eres leyenda del ecosistema."},right:{label:"Rechazar: seremos el próximo Google",sub:"Delirio de grandeza (o visión)",effect:{vcs:-18,ventas:8,producto:6,cultura:12,cash:40,soul:-3},result:"Dijiste NO a Google. La sala quedó en silencio. Elena sonrió: 'Nos vemos en 5 años... o en tu funeral'."},isGoogle:!0},c1={"rea-copied":{title:"TE COPIARON CON REA",story:"Un competidor usó REA para estudiar el comportamiento del producto compilado y reconstruir sus funciones clave. No recuperó tu código fuente, pero consiguió algo que el mercado considera suficiente: una alternativa casi indistinguible, seis semanas después y a mitad de precio. Tu equipo original sigue teniendo la autoría. El mercado ha elegido el clon.",emoji:"🪞"},"rea-accused":{title:"ACUSACIÓN DE COPIA",story:"El informe de REA encuentra demasiados rastros de una aplicación ajena en la tuya. No prueba por sí solo quién copió a quién, pero el hilo viral ya tiene capturas, hashes y una cronología que nadie de tu equipo puede explicar. El original publica su repo; tu abogado pide tiempo. El mercado no espera.",emoji:"⚖️"},files:{title:"TU NOMBRE EN LA PÁGINA 212",story:"No fue un delito. Fue un nombre en un correo, en un archivo, en una cena. Los VCs dejaron de coger el teléfono, los clientes enterprise 'revisaron su relación' y tu equipo publicó una carta abierta. Hay cosas que no se arreglan con un comunicado. Tampoco con un NDA.",emoji:"📎"},vcs:{title:"DESTITUIDO POR EL BOARD",story:"Los VCs perdieron la fe. Te convocaron a un 'board extraordinario' un viernes a las 18h. Saliste sin email corporativo, sin MacBook y sin dignidad. Tu silla ya la ocupa un ex-McKinsey que dice 'sinergias'.",emoji:"🦈"},ventas:{title:"SIN TRACCIÓN, SIN EMPRESA",story:"El dashboard plano durante semanas. Los VCs dejaron de responder tus updates. El último cliente canceló con un 'suerte con todo'. Apagaste el servidor un martes. Nadie lo notó hasta el jueves.",emoji:"📉"},producto:{title:"EL PRODUCTO MURIÓ",story:"El churn llegó al 30%. La app caía más que funcionaba. Las reviews de 1 estrella eran poemas de odio. Tuviste que poner una página de 'estamos en mantenimiento' que nunca volvió.",emoji:"💥"},cultura:{title:"LA GRAN DIMISIÓN",story:"Primero fue Javi. Luego tres devs. Luego todo #general era un velatorio. El último apagó Slack con un 'fue bonito mientras duró'. Te quedaste solo con el Notion y dos plantas muertas.",emoji:"🪦"},cash:{title:"BANCARROTA TOTAL",story:"La cuenta llegó a $0 un martes. Nóminas impagadas, AWS cortado, la oficina precintada. Vendiste las sillas Herman Miller en Wallapop para pagar al abogado. Game over financiero.",emoji:"💸"}};function K0(d){return d>=1e3?`$${(d/1e3).toFixed(2)}M`:d<0?`-$${Math.abs(d)}k`:`$${d}k`}const ya=[{id:"sep22",label:"SEP 2022",startDay:0,visits:3,title:"El fin del dinero gratis",headline:"La Fed sube 75 pb. En Europa la guerra de Ucrania encarece la energía: tu nube cuesta un 40% más.",market:"El burn importa otra vez. Y el streaming de la guerra ya no es una noticia lejana.",region:"GLOBAL",tone:"crisis",accent:"text-slate-300"},{id:"oct22",label:"OCT 2022",startDay:30,visits:3,title:"Twitter arde",headline:"Musk cierra Twitter y despide a 3.700 por email. El talento inunda LinkedIn a precio de derribo.",market:"Fichar es barato. La confianza, no. En Shanghái, mientras, funden GPUs a escondidas.",region:"SAN FRANCISCO",tone:"crisis",accent:"text-sky-300"},{id:"nov22",label:"NOV 2022",startDay:61,visits:3,title:"Llega ChatGPT",headline:"ChatGPT: 1M de usuarios en 5 días. Tu roadmap entero parece escrito en 2019 con dos velas.",market:"Todo el mundo pregunta por IA. Nadie sabe qué es. En China, Baidu se prepara para copiarlo.",region:"SAN FRANCISCO",tone:"hype",accent:"text-emerald-300"},{id:"ene23",label:"ENE 2023",startDay:122,visits:3,title:"El invierno de los despidos",headline:"200.000 despidos en Big Tech. 'Eficiencia' es la palabra del año. Otra vez. Y van dos.",market:"Hay seniority tirada en LinkedIn. También inversores pidiendo 'AI story' en cada slide.",region:"SEATTLE / MOUNTAIN VIEW",tone:"crisis",accent:"text-blue-300"},{id:"feb23",label:"FEB 2023",startDay:153,visits:3,title:"Llama se filtra",headline:"Meta filtra Llama por accidente: en una semana hay pesos de un modelo frontier en 4chan.",market:"El open source rompe el precio de la inteligencia. Tu SaaS acaba de convertirse en un notebook de Colab.",region:"MENLO PARK / EL INTERNET",tone:"hype",accent:"text-orange-300"},{id:"mar23",label:"MAR 2023",startDay:181,visits:3,title:"48 horas para SVB",headline:"Silicon Valley Bank quiebra: la nómina de media industria está en el aire. Y la tuya.",market:"La caja es un medidor emocional. En Europa, Credit Suisse se cae el mismo fin de semana.",region:"SANTA CLARA / ZÚRICH",tone:"crisis",accent:"text-rose-300"},{id:"abr23",label:"ABR 2023",startDay:212,visits:3,title:"La fiebre del wrapper",headline:"Un GPT wrapper de dos semanas levanta $10M. En Bangalore, uno igual, por 1/10 del coste.",market:"El mercado premia logos con 'IA'. El alma cotiza a la baja y el talento, también.",region:"SF / BANGALORE",tone:"hype",a
