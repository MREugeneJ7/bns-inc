<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body { perspective: 1400px; overflow: hidden; }
  #tape { transition: transform 1.2s cubic-bezier(.6,-0.2,.3,1.3); transform-style: preserve-3d; }
  #tape.flipped { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; position: absolute; inset: 0; }
  .back { transform: rotateY(180deg); }
  .fade { transition: opacity 1.5s; }
  .letter { display: inline-block; transition: transform 1.6s cubic-bezier(.5,0,.9,.4), opacity 1.6s; }
  .letter.fall { transform: translateY(120vh) rotate(var(--r)); opacity: 0; }
  #sideb { transition: opacity .4s; white-space: nowrap; touch-action: manipulation; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body class="h-screen w-screen bg-white font-mono">
<div id="tape" class="relative h-full w-full">

  <!-- SIDE A -->
  <section class="face bg-white flex flex-col items-center justify-center text-black">
    <h1 id="hello" class="text-5xl">Hello, World.</h1>
    <p id="note" class="fade mt-6 text-sm text-gray-400 opacity-0 h-5"></p>
    <a id="sideb" href="#" class="fixed z-20 p-2 text-[10px] text-gray-300 opacity-0 hover:text-gray-500 select-none">side B →</a>
  </section>

  <!-- SIDE B -->
  <section class="face back bg-black flex flex-col items-center justify-center text-white">
    <p class="text-xs tracking-[.4em] text-gray-500 mb-8">SIDE B · TRACK 1</p>
    <h1 id="goodbye" class="text-5xl md:text-6xl font-serif italic"></h1>
    <p id="bnote" class="fade mt-8 text-sm text-gray-500 opacity-0 h-5"></p>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const note = $('note'), link = $('sideb'), tape = $('tape');
const say = (t, el = note) => { el.style.opacity = 0; setTimeout(() => { el.textContent = t; el.style.opacity = 1; }, 400); };
const rand = (a, b) => a + Math.random() * Math.max(0, b - a);

/* Coloca el enlace en una franja libre: nunca sobre el texto, nunca fuera de pantalla. */
function safeSpot() {
  const m = 14, pad = 30;
  // +14px de margen: al hacer hover el texto cambia a "nothing →" y es un poco más ancho
  const w = (link.offsetWidth || 64) + 14, h = link.offsetHeight || 28;
  const vw = innerWidth, vh = innerHeight;
  const rects = [$('hello'), note].map(el => el.getBoundingClientRect());
  const b = {
    l: Math.min(...rects.map(r => r.left)) - pad,
    t: Math.min(...rects.map(r => r.top)) - pad,
    r: Math.max(...rects.map(r => r.right)) + pad,
    b: Math.max(...rects.map(r => r.bottom)) + pad
  };
  const strips = [];
  if (vh - m - h > b.b + 6) strips.push(() => [rand(m, vw - m - w), rand(b.b + 6, vh - m - h)]); // debajo
  if (b.t - 6 - h > m)      strips.push(() => [rand(m, vw - m - w), rand(m, b.t - 6 - h)]);      // arriba
  if (b.l - 6 - w > m)      strips.push(() => [rand(m, b.l - 6 - w), rand(m, vh - m - h)]);      // izquierda
  if (vw - m - w > b.r + 6) strips.push(() => [rand(b.r + 6, vw - m - w), rand(m, vh - m - h)]); // derecha
  const pick = strips[Math.floor(Math.random() * strips.length)] || (() => [m, vh - m - h]);
  let [x, y] = pick();
  const px = parseFloat(link.style.left), py = parseFloat(link.style.top);
  if (!isNaN(px) && Math.hypot(x - px, y - py) < 120) [x, y] = pick(); // que se note que "se movió"
  return [Math.round(x), Math.round(y)];
}

function placeLink(corner = false) {
  const w = link.offsetWidth || 64, h = link.offsetHeight || 28;
  const [x, y] = corner
    ? [innerWidth - w - 14, innerHeight - h - 14]
    : safeSpot();
  link.style.right = 'auto';
  link.style.bottom = 'auto';
  link.style.left = x + 'px';
  link.style.top = y + 'px';
}

addEventListener('resize', () => placeLink());

const denials = [
  "what link?",
  "there was no link. you clicked the void.",
  "you're remembering it wrong.",
  "side B was never a thing. ask anyone.",
  "this website has always had one side.",
  "are you okay? you seem tired.",
  "ok fine. you were on side B the whole time."
];
let tries = 0, busy = false;

function boot() {
  tries = 0; busy = false;
  $('hello').textContent = "Hello, World.";
  note.style.opacity = 0; link.style.opacity = 0;
  link.textContent = "side B →";
  placeLink(true);
  document.title = "Hello World";
  setTimeout(() => say("(there is no side B)"), 2200);
  setTimeout(() => { link.style.opacity = 1; }, 5000);
}

link.addEventListener('mouseenter', () => { if (tries > 0) link.textContent = "nothing →"; });
link.addEventListener('mouseleave', () => link.textContent = "side B →");
link.addEventListener('click', e => {
  e.preventDefault();
  if (busy) return;
  link.textContent = "side B →";
  say(denials[tries]);
  $('hello').classList.add('shake');
  setTimeout(() => $('hello').classList.remove('shake'), 400);
  link.style.opacity = 0;
  // se muda a otro sitio seguro, como si nunca se hubiera movido
  setTimeout(() => {
    placeLink();
    if (tries < denials.length) link.style.opacity = 1;
  }, 1600);
  if (tries === 3) $('hello').textContent = "Hello, World. (as always)";
  tries++;
  if (tries === denials.length) { busy = true; setTimeout(flip, 2200); }
});

function flip() {
  document.title = "Goodbye Cruel World";
  const g = $('goodbye'); g.innerHTML = "";
  [..."Goodbye, Cruel World."].forEach(ch => {
    const s = document.createElement('span');
    s.className = 'letter'; s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    g.appendChild(s);
  });
  $('bnote').style.opacity = 0;
  tape.classList.add('flipped');
  setTimeout(() => say("*dramatic violin*", $('bnote')), 2000);
  setTimeout(() => {
    g.querySelectorAll('.letter').forEach((s, i) => setTimeout(() => s.classList.add('fall'), i * 90));
  }, 4000);
  setTimeout(() => say("...anyway.", $('bnote')), 6500);
  setTimeout(() => { tape.classList.remove('flipped'); boot(); setTimeout(() => say("side B? we don't have a side B."), 2600); }, 8500);
}

boot();
</script>
</body>
</html>
