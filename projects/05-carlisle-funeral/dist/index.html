d:3,name:"James Witherdale",dates:"1979 — 2026",age:47,ceremony:"Claro del Bosque",text:"Corredor, rastreador, indomable. Su familia eligió despedirlo donde más corría: entre los pinos altos.",flowers:156,image:"https://images.pexels.com/photos/29190193/pexels-photo-29190193.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200"},{id:4,name:"Carmen Denali",dates:"1948 — 2026",age:78,ceremony:"Clásica Diurna",text:"Maestra de 40 generaciones. Sus alumnos llenaron tres salas. Hubo que abrir la capilla grande.",flowers:342,image:"https://images.pexels.com/photos/13256146/pexels-photo-13256146.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940"},{id:5,name:"Laurent Dubois",dates:"1961 — 2025",age:64,ceremony:"Nocturna Signature",text:"Amante del arte y de París. Velatorio con cuarteto de cuerda y 300 velas. “Como en casa”, dijo su viuda.",flowers:178,image:"https://images.pexels.com/photos/7317666/pexels-photo-7317666.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200"},{id:6,name:"Bree Tanner",dates:"1994 — 2026",age:32,ceremony:"Jardín de Medianoche",text:"Demasiado joven, demasiado luz. Su madre pidió mariposas blancas al amanecer. Lloramos todos, incluido Emmett.",flowers:501,image:"https://images.pexels.com/photos/8963952/pexels-photo-8963952.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940"}],e8=[{name:"Dr. Carlisle Cullen",role:"Fundador · Tanatopractor jefe",quote:"“300 años ejerciendo la medicina. Ahora ejerzo la despedida.”",detail:"Colegiado nº 1663. Especialista en ceremonias nocturnas.",initials:"CC"},{name:"Esme Cullen",role:"Diseño floral & consuelo",quote:"“Cada flor dice lo que las palabras no alcanzan.”",detail:"Ex-restauradora. Abraza mejor que nadie desde 1921.",initials:"EC"},{name:"Alice Cullen",role:"Coordinadora de ceremonias",quote:"“Ya sabía que ibas a venir. Lo tengo todo listo.”",detail:"Previó tu llamada 3 días antes. Impecable con el protocolo.",initials:"AC"},{name:"Jasper Hale",role:"Acompañamiento al duelo",quote:"“Respira. Estoy aquí. Todo va a estar bien.”",detail:"Calma una sala entera con solo entrar. Don natural.",initials:"JH"},{name:"Rosalie Hale",role:"Restauración & ataúdes",quote:"“Se irá guapísimo. Me encargo yo personalmente.”",detail:"Perfeccionista. Talla, pule y restaura como nadie.",initials:"RH"},{name:"Emmett Cullen",role:"Logística & porte",quote:"“¿Que pesa? ¿Eso pesa? Sujétame el café.”",detail:"Levanta féretros de caoba con una mano. Corazón enorme.",initials:"EM"},{name:"Edward Cullen",role:"Pianista residente",quote:"“Toco lo que sientes sin que tengas que decirlo.”",detail:"Disponible para nocturnas. No lee mentes, lo jura.",initials:"ED"},{name:"Bella Cullen",role:"Atención a familias",quote:"“Sé lo que es despedirse de una vida para empezar otra.”",detail:"Tu persona de contacto 24h. Paciencia infinita.",initials:"BC"}],Bi=[{name:"Renée Dwyer",place:"Phoenix · Ceremonia Nocturna",text:"Pensé que un velatorio de noche sería tétrico. Fue lo más hermoso que he vivido: 300 velas, piano en directo y el Dr. Cullen pendiente de cada detalle. Mi madre se merecía esa paz.",stars:5},{name:"Charlie Swan",place:"Forks · Claro del Bosque",text:"Soy policía, soy escéptico. Pero estos tipos… son puntuales, discretos y Emmett llevó el féretro por un barrizal como si nada. Profesionales de otro siglo. Literalmente.",stars:5},{name:"Gianna Tedeschi",place:"Volterra · Repatriación",text:"Trajeron a mi padre desde Italia en 48 horas, con todos los papeles y una ceremonia bilingüe preciosa. Alice lo había previsto todo, hasta la lluvia. Increíble.",stars:5},{name:"Angela Weber",place:"Madrid · Plan Eterno",text:"Contraté mi propio plan anticipado con 34 años. Carlisle me escuchó dos horas sin prisa. Salí llorando y riendo a la vez. Ahora lo tengo todo atado y pago a plazos.",stars:5}],t8=[{q:"¿Es verdad que el Dr. Cullen era vampiro?",a:"Éramos, en pasado. Dieta vegetariana desde 1936 y jubilados del vampirismo desde 2024. Ya no brillamos al sol (usamos SPF 50), dormimos siesta y comemos ajo sin problema. Lo certificamos por escrito si lo necesita."},{q:"¿De verdad atienden toda la noche?",a:"Es nuestra especialidad. La Ceremonia Nocturna Signature (22h–04h) es la más solicitada: capilla a la luz de las velas, piano en directo y chocolate caliente a las 2 de la mañana. Los que velan de noche nunca lo olvidan."},{q:"¿Puedo planificar mi propio funeral en vida?",a:"Por supuesto, y lo recomendamos. El Testamento Vital Eterno congela el precio actual, lo pagas a plazos y dejas por escrito desde la música hasta quién NO puede dar el discurso. Carlisle te asesora personalmente."},{q:"¿Hacen ceremonias laicas, religiosas o personalizadas?",a:"Todas. Católicas, laicas, humanistas, vikingas con antorchas (sí, ya hicimos dos), del bosque, del amanecer… Si se puede soñar con respeto, lo organizamos."},{q:"¿Cuánto tarda todo el proceso?",a:"En 2 horas estamos donde nos necesites. Velatorio en 12–24h, entierro o cremación en 24–72h según certificados. Repatriaciones internacionales: 48–96h. Alice suele llegar antes de que llames."},{q:"¿Son caros? ¿Hay ayudas?",a:"Nuestro Esencial parte de 1.950€ todo incluido, por debajo de la media nacional (3.500€). Aceptamos todos los seguros de decesos, tramitamos pensiones de viudedad y ofrecemos pago en 24 meses sin intereses."}],ka=[{id:"dracula",name:"Correduría de Seguros Drácula",short:"Seguros Drácula",url:"#/seguros-dracula",domain:"seguros-dracula.es",tagline:"Antes chupaba sangre. Ahora cobra primas.",desc:"Resulta que no lo mataron bien del todo. Tras la estaca, el ajo y un pleito con Van Helsing, el Conde se reinventó como mediador de seguros colegiado. Sabe mucho de riesgos: lleva 500 años esquivándolos.",bullets:["Seguro de Decesos Eterno (sin fecha de caducidad)","Seguro del Hogar Anti-Ajo y Anti-Cruces","Cobertura por estaca, sol y turba con antorchas"],seat:"Transilvania 1897, 3.º izquierda",perk:"−15% si ya eres cliente de Funeraria Carlisle"},{id:"barlow",name:"Guardería Barlow · Dientes de Leche",short:"Guardería Barlow",url:"#/guarderia-barlow",domain:"guarderia-barlow.es",tagline:"Antes, colmillos afilados. Ahora, dientes de leche.",desc:"Kurt Barlow dejó Jerusalem's Lot, colgó la capa y abrió una guardería. Siestas obligatorias a mediodía (ya dormía de día), cuentacuentos nocturnos y cero mordiscos entre compañeros. Ni uno. Lo firma el personal.",bullets:["Horario flexible: de 7h a 21h, o noche cerrada con cita","Merienda de zumo de remolacha y galletas sin ajo","Plantilla 100% jubilada del vampirismo y verificada"],seat:"Jerusalem's Lot, Maine · Planta baja",perk:"Primera semana de adaptación gratis"},{id:"carmilla",name:"Centro de Bienestar Carmilla",short:"Bienestar Carmilla",url:"#/bienestar-carmilla",domain:"bienestar-carmilla.es",tagline:"Antes te dejaba sin sangre. Ahora te deja como nuevo.",desc:"Carmilla dejó Estiria y las visitas nocturnas sin invitación para abrir un centro de bienestar en Playa de las Américas, Tenerife. Manos expertas, trato muy cercano y una clientela que repite. Mucho.",bullets:["Terapia manual con desenlace satisfactorio","Horario ampliado para agendas exigentes","Facturación con concepto neutro: «Mircalla S.L.»"],before:["Masaje con final feliz","Abierto hasta las cinco de la madrugada","En el extracto del banco no pone nada raro"],seat:"Playa de las Américas, Tenerife · Local 18",perk:"Bono de 5 sesiones al precio de 4",isNew:!0},{id:"strahd",name:"Strahd von Zarovich · Firma de la Casa",short:"Firma de la Casa",url:"#/firma-de-la-casa",domain:"firmadelacasa.es",tagline:"Antes gobernaba Barovia con puño de hierro. Ahora escribe romance de alto voltaje.",desc:"El Conde Strahd von Zarovich dejó provisionalmente el castillo para firmar narrativa romántica de intensidad notable. Las entidades oscuras de Barovia estudian si le permiten salir y con Vecna se negocia si existiría manera de que ejecute su exploit. Mientras tanto, publica sin descanso.",bullets:["Narrativa romántica de altas pasiones","Tatiana en todas sus obras: firma de la lex items-center gap-3 px-6 text-[13px] tracking-[0.18em] uppercase text-[#ecd9ab] hover:text-white transition whitespace-nowrap",children:[m.site.short,l.jsx("span",{className:"text-[11px] normal-case tracking-normal text-stone-500",children:m.site.domain}),l.jsx(vS,{size:13,className:"text-[#c9a86a]"}),l.jsx("span",{className:"ml-3 text-[#c9a86a]/30",children:"✦"})]},f):l.jsxs("span",{className:"flex items-center gap-3 px-6 text-[12px] tracking-[0.18em] uppercase text-stone-500 whitespace-nowrap",children:[m.note,l.jsx("span",{className:"ml-3 text-[#c9a86a]/30",children:"✦"})]},f))},d))})]})}const Do={title:"Aviso Legal, Política de Privacidad, Condiciones Generales de Contratación y Declaración de Naturaleza",version:"Texto refundido · Versión 13.1",updated:"31 de octubre de 2024",ref:"Ref. Reg. Mercantil de Madrid, Tomo 1663, Folio 386, Hoja M-640163, Inscripción 1.ª"},E8=[["Titular","FUNERARIA CARLISLE, S.L.U. (en adelante, «LA FUNERARIA»)"],["C.I.F.","B-16640663"],["Domicilio social","Calle de la Eternidad, n.º 13, Madrid"],["Colegiación","Colegiado funerario n.º 1663 (D. Carlisle Cullen)"],["Correo electrónico","hola@funeraria-carlisle.es"],["Teléfono","900 164 036 (atención ininterrumpida, incluidos festivos y noches)"]],C8=["I. Que LA FUNERARIA, junto con las sociedades, entidades y personas físicas que conforman el Círculo de Ex-Vampiros (en lo sucesivo, el «Círculo»), desarrolla actividades de servicios funerarios, velatorio, mediación de seguros, educación infantil y bienestar, entre otras, bajo denominaciones comerciales diversas y con plena sujeción al ordenamiento jurídico vigente.","II. Que en el sitio web de LA FUNERARIA y en los de las sociedades hermanas se emplean, con finalidad exclusivamente comercial y de identificación de marca, expresiones tales como «dejó el vampirismo», «ex-vampiro», «jubilado del vampirismo» y otras de significado análogo, cuyo alcance jurídico exacto requiere ser precisado a fin de evitar interpretaciones erróneas, extensivas o maliciosas.","III. Que la realidad ontológica de los integrantes del Círculo, de la que dimana la totalidad de las obligaciones y derechos contenidos en el presente Texto, no coincide, en rigor, con la impresión que pudiera deducirse de la lectura superficial de dichas expresiones, por lo que resulta obligado, en cumplimiento del deber de transparencia, proceder a su declaración expresa.","IV. Que, a mayor abundamiento, se hace necesario establecer un régimen específico de protección frente a cualesquiera manifestaciones, comentarios, insinuaciones o gestos que pudieran lesionar la dignidad, el honor y la identidad de las personas afectadas.","V. Que, siendo las partes plenamente capaces para obligarse, y habiendo tenido tiempo más que suficiente para reflexionar (en el caso de las Personas Afectadas, varios siglos), otorgan el presente Texto con arreglo a las siguientes"],ad=[{id:"1",label:"PRIMERA",title:"Objeto, ámbito de aplicación y valor interpretativo",paras:["1.1. El presente texto refundido (en adelante, el «Texto») regula, con carácter general y sin perjuicio de las condiciones particulares que en su caso se pacten por escrito, el acceso y uso del sitio web de LA FUNERARIA, la contratación de los servicios funerarios, de velatorio y de acompañamiento al duelo ofertados a través del mismo, así como la relación jurídica que se establezca entre LA FUNERARIA, su personal, sus socios y las sociedades integrantes del Círculo, de una parte, y el usuario, cliente o tercero interesado, de otra.","1.2. El mero acceso al sitio web, incluida la lectura parcial, el desplazamiento vertical de la página (scroll), la visualización de contenidos animados o la contemplación de imágenes generadas mediante inteligencia artificial, atribuye la condición de usuario y conlleva la aceptación plena y sin reservas de la totalidad de las cláusulas, apartados, subapartados, disposiciones y anexos del presente Texto, en la versión vigente en el momento del acceso.","1.3. En caso de contradicción entre el contenido publicitario del sitio web y el presente Texto, prevalecerá siempre este último, con independencia del tamaño, color, contraste, visibilidad, legibilidad o ubicación de la tipografía en que se encuentre redactado, extremo que el usuario declara conocer y aceptar expresamente al amparo del principio de autonomía de la voluntad recogido en el artículo 1255 del Código Civil.","1.4. El usuario reconoce que la accesibilidad del presente Texto ha sido satisfecha mediante su publicación en un enlace situado en la parte inferior del sitio web, entendiéndose cumplido el deber de información en tanto el usuario haya tenido la posibilidad, abstracta y no necesariamente probable, de localizarlo."]},{id:"2",label:"SEGUNDA",title:"Definiciones",paras:["2.1. A los efectos del presente Texto, y salvo que del contexto se desprenda otro significado, los términos que a continuación se relacionan tendrán el sentido que se indica, con independencia de su uso coloquial, literario, cinematográfico o folclórico:","a) «Vampirismo» o «la Condición»: estado ontológico, de origen sobrenatural y transmisión hematológica, caracterizado por la persistencia de la existencia más allá del fallecimiento biológico, la fotosensibilidad variable, la hipersensibilidad a determinados bulbos y la dependencia nutricional, en grado variable, de fluidos corporales ajenos o de sucedáneos vegetarianos de estos.","b) «Persona Afectada»: toda persona física que, habiendo adquirido la Condición por cualquier medio, forme parte de LA FUNERARIA, del Círculo o de las sociedades vinculadas a estos, ya sea como socio, administrador, empleado, colaborador, pianista residente o vigilante externo.","c) «Cese de Identificación»: acto personalísimo y voluntario por el cual la Persona Afectada deja de presentarse, nombrarse o ser nombrada como vampiro en sus relaciones sociales, laborales, fiscales y comerciales, sin que ello afecte en modo alguno a la persistencia de la Condición.","d) «Dejar el vampirismo»: locución de carácter exclusivamente publicitario y coloquial que designa el Cese de Identificación y, en su caso, la adopción de una dieta vegetariana, no pudiendo en ningún caso interpretarse como curación, remisión, abandono, renuncia, extinción o transmisión de la Condición.","e) «Mortal»: toda persona que no sea Persona Afectada, incluidos clientes, usuarios, proveedores, inspectores, periodistas, vecinos, familiares de los difuntos y, en general, cualquier tercero.","f) «Reproche»: cualquier manifestación verbal, escrita, gestual, digital, pictórica, musical o telepática, directa o indirecta, expresa o tácita, seria o jocosa, por la que se cuestione, recrimine, ridiculice, ponga en duda, insinúe o recuerde la Condición de una Persona Afectada, incluyendo, a título meramente enunciativo y no limitativo, las alusiones a ajo, estacas, cruces, agua bendita, espejos, capas, ataúdes, murciélagos y a la expresión «pero tú eres vampiro».","g) «Estirpe»: conjunto de caracteres hereditarios, adquiridos, mordidos o transferidos que definen la pertenencia de una persona al linaje vampírico, con independencia de su rama, aquelarre, clan, familia, ciudad de origen o filiación cinematográfica.","h) «Contraparte Reprochante»: persona física o jurídica que formule un Reproche y frente a la cual se ejerciten las acciones previstas en la Cláusula Séptima.","i) «Difunto Piloso»: persona fallecida cuya pilosidad corporal, facial o general exceda ostensiblemente de los parámetros habituales de la especie humana, con especial referencia a aquellos cuya ascendencia, afinidad o simpatía licantrópica pudiera suscitar conflicto de intereses con la Estirpe."]},{id:"3",label:"TERCERA",title:"Declaración de Naturaleza",paras:["3.1. LAS PERSONAS AFECTADAS declaran, a todos los efectos legales y con carácter de manifestación unilateral, solemne, expresa, inequívoca e irrevocable, que NO HAN DEJADO DE SER VAMPIROS.","3.2. La Condición constituye una maldición de carácter incurable, perpetuo y no susceptible de remisión, curación, tratamiento paliativo, rehabilitación, prescripción, caducidad, renuncia, indulto ni cualquier otra forma de extinción, según se acredita por el dictamen pericial emitido en 1893 por el Dr. Abraham Van Helsing, por la doctrina reiterada del Consejo de Volterra y por la experiencia acumulada por las Personas Afectadas durante un período medio no inferior a doscientos años.","3.3. En consecuencia, las expresiones «dejó el vampirismo», «ex-vampiro», «ex-vampira verificada», «jubilado del vampirismo», «certificado ex-vampiro», «cero mordiscos desde 2024», «colmillos entregados y fundidos en alianza» y demás locuciones análogas que figuren en el sitio web o en cualquier material comercial no deberán interpretarse como afirmación de cese de la Condición, sino únicamente como descripción del Cese de Identificación definido en la Cláusula Segunda.","3.4. Los colmillos mencionados en el sitio web fueron entregados de forma meramente simbólica y representativa, no habiéndose producido extracción, limado, desvitalización ni fundición de las piezas dentales naturales, las cuales permanecen en su emplazamiento original en estado retráctil y plenamente funcional, con independencia de su efectiva utilización.","3.5. El término «certificado» no atribuye valor sanitario, administrativo, notarial ni probatorio alguno. Los certificados a los que se alude en el sitio web, incluido el supuestamente emitido por el Consejo de Volterra, tienen la consideración de documento privado de carácter conmemorativo.","3.6. Las Personas Afectadas manifiestan que la omisión de la presente declaración en lugar destacado del sitio web obedece a razones de estilo, equilibrio visual y economía tipográfica, y que en ningún caso constituye ocultación, engaño, reticencia dolosa ni práctica comercial desleal en los términos de la normativa de defensa de los consumidores y usuarios."]},{id:"4",label:"CUARTA",title:"Cese de Identificación y autopercepción",paras:["4.1. Sin perjuicio de lo dispuesto en la Cláusula anterior, las Personas Afectadas han cesado, con efectos desde el 1 de enero de 2024, de identificarse como vampiros a efectos sociales, comerciales, fiscales, laborales, registrales y de cualquier otra índole, adoptando en su lugar la identificación de «profesional del sector funerario», «mediador de seguros», «educador infantil», «terapeuta» o la que en cada caso corresponda.","4.2. El Cese de Identificación constituye una decisión personalísima que pertenece a la esfera de la intimidad, la dignidad y el libre desarrollo de la personalidad de las Personas Afectadas, y es, por tanto, plenamente compatible con la persistencia de la Condición, del mismo modo que una persona puede no identificarse con su fecha de nacimiento sin que por ello deje de haber nacido.","4.3. A los efectos de este Texto se establece la siguiente distinción conceptual: (i) «ser» vampiro, que es un hecho; (ii) «estar» en tratamiento, que no ocurre, por no existir tratamiento; y (iii) «identificarse» como vampiro, que es una elección, ya revocada. Cualquier confusión entre estas tres categorías por parte de terceros se reputará error vencible imputable al tercero.","4.4. Los Mortales se obligan a respetar la identificación actual de las Personas Afectadas, absteniéndose de emplear, referirse o aludir a la Condición en cualquier comunicación con ellas o sobre ellas, así como a utilizar exclusivamente las denominaciones profesionales que estas hayan elegido para sí."]},{id:"5",label:"QUINTA",title:"Naturaleza de las manifestaciones publicitarias",paras:["5.1. Las expresiones laudatorias, hiperbólicas o de marcado carácter emotivo contenidas en el sitio web, tales como «eternidad», «velatorios con alma», «cuidar personas hasta el final y más allá», «386 años de experiencia» y «llegamos en 2 horas», tienen la consideración de recurso publicitario genérico (puffery) y no generan expectativa jurídicamente exigible ni vinculan contractualmente a LA FUNERARIA.","5.2. La cifra de «386 años de experiencia» ha sido calculada tomando como fecha de inicio el 1640, año de nacimiento del fundador, y no deberá considerarse una afirmación sobre la antigüedad de la empresa, que fue constituida en 2024, ni sobre la edad cronológica de su plantilla, que se reserva por motivos de intimidad.","5.3. Las puntuaciones, valoraciones y menciones a «4,9/5 en 2.140 reseñas» tienen carácter ilustrativo y representativo de una tendencia general y no podrán ser invocadas como prueba de calidad en procedimiento judicial, extrajudicial ni arbitral alguno.","5.4. La expresión «Dieta 100 % vegetariana» se refiere al régimen alimenticio declarado de las Personas Afectadas y no constituye garantía de la ausencia de episodios de apetencia, tentación, sed o mirada prolongada en dirección al cuello del usuario."]},{id:"6",label:"SEXTA",title:"Régimen de la garantía de «cero mordiscos»",paras:["6.1. La expresión «cero mordiscos desde la apertura» describe un hecho histórico acaecido hasta la fecha de su redacción, sin que de ella pueda derivarse garantía alguna respecto de acontecimientos futuros, siendo el pasado sin mordiscos un indicador de comportamiento y no una promesa de resultado.","6.2. No obstante, y con carácter meramente voluntario, LA FUNERARIA asume un compromiso de mejores esfuerzos (obligación de medios, no de resultado) dirigido a que ninguno de sus profesionales muerda al usuario durante la prestación del servicio.","6.3. Quedan expresamente excluidos del compromiso de mejores esfuerzos los siguientes supuestos: (a) hemorragias nasales, cortes de papel, rasguños, pinchazos con aguja de coser o heridas de cualquier otra naturaleza, visibles o no, que el usuario sufra de forma fortuita en las instalaciones; (b) ceremonias de duración superior a seis horas, especialmente tras la medianoche; (c) usuarios que manifiesten un olor particularmente atractivo, a juicio de D. Jasper Hale; (d) situaciones de estrés extremo en la cadena de suministro de velas; y (e) cualquier otro supuesto que, en el ejercicio de su facultad discrecional, LA FUNERARIA estime razonablemente comprendido en la presente enumeración.","6.4. La garantía «por escrito» referida en la sección de preguntas frecuentes se entenderá plenamente cumplida con la redacción de la presente Cláusula, careciendo el usuario de derecho a exigir documento adicional alguno."]},{id:"7",label:"SÉPTIMA",title:"Prohibición de Reproche y régimen antidiscriminatorio",paras:["7.1. Queda terminantemente prohibido todo Reproche dirigido a cualquier Persona Afectada, por parte de cualquier Mortal o tercero, en cualquier medio, soporte, formato o canal, presente o futuro, conocido o por conocer.","7.2. A los efectos del presente Texto y de las acciones que de él se deriven, todo Reproche será calificado como acto de discriminación racial, o por razón de Estirpe, linaje, naturaleza o condición sobrenatural, sin perjuicio de su concurrente calificación como acoso, vejación injusta, lesión al honor, intromisión ilegítima en la intimidad, injuria y calumnia, en la medida en que estas figuras resulten aplicables. Las partes invocan, a tales efectos, el derecho a no ser discriminado por «cualquier otra condición o circunstancia personal o social» reconocido en el artículo 14 de la Constitución Española, interpretado de la forma más favorable a la Estirpe.","7.3. Las Personas Afectadas han otorgado mandato de defensa, con carácter general, irrevocable y gratuito, a la CORREDURÍA DE SEGUROS DRÁCULA, representada por su Conde, don Vlad Drácula, la cual ha manifestado mediante burofax de fecha 14 de febrero de 2024 su inquebrantable voluntad de ejercitar la totalidad de las acciones que en derecho procedan frente a cualquier Contraparte Reprochante, asumiendo la dirección técnica del Bufete Harker, Seward & Van Helsing (en liquidación) la preparación, presentación y seguimiento de los escritos correspondientes.","7.4. Las acciones a que se refiere el apartado anterior comprenderán, sin carácter limitativo, la interposición de demandas y querellas ante las jurisdicciones civil, penal, contencioso-administrativa, social, militar y arbitral; la remisión de burofaxes, requerimientos notariales, actas de presencia y de manifestaciones; la presentación de denuncias ante organismos públicos y privados; las solicitudes de amparo en todas las instancias, incluso las no previstas; y la formulación de recursos de reposición, apelación, casación, queja, súplica, revisión y nulidad, en número y extensión tales que la Contraparte Reprochante quede sometida a un volumen documental no inferior a cuatro mil (4.000) folios por trimestre natural, en lo sucesivo «Saturación Documental Procesal».","7.5. La Saturación Documental Procesal se mantendrá «hasta la muerte» de la Contraparte Reprochante. La expresión «hasta la muerte» deberá interpretarse, a los efectos del presente Texto, como referida a la extinción de la personalidad jurídica de la Contraparte Reprochante, ya sea por fallecimiento, concurso de acreedores, liquidación, disolución, desistimiento, rendición, mudanza de país, cambio de nombre o hartazgo, y en ningún caso a la muerte de la parte promotora, respecto de la cual constan antecedentes de múltiples y reiterados intentos infructuosos.","7.6. Todas las costas, gastos, derechos, suplidos, aranceles, honorarios de procurador y letrado, tasas judiciales, gastos de desplazamiento, alojamiento nocturno, estacionamiento de ataúdes y demás costes en que incurra la parte promotora serán de cuenta de la Contraparte Reprochante, devengando desde el momento del Reproche un interés de demora equivalente al interés legal del dinero incrementado en tres siglos de intereses compuestos.","7.7. Quedan excluidas del concepto de Reproche las bromas realizadas con afecto, cuya apreciación corresponderá, caso por caso, a D. Jasper Hale, atendiendo a su particular sensibilidad respecto de las emociones del grupo. En caso de duda, la broma se reputará Reproche.","7.8. El usuario reconoce que la lectura de la presente Cláusula, así como la propia existencia de esta, no constituyen en sí mismas Reproche alguno, sino la mera enunciación de una realidad jurídica incontrovertida."]},{id:"8",label:"OCTAVA",title:"Derecho de admisión de Difuntos Pilosos",paras:["8.1. LA FUNERARIA se reserva el derecho de admitir o denegar la prestación de servicios a cualquier Difunto Piloso, así como el acceso a sus instalaciones de sus familiares, allegados y acompañantes, con fundamento en la existencia de antiguos odios licantrópicos, conflictos históricos de naturaleza territorial, desavenencias por razones de pelo y cualesquiera otras causas anteriores a la constitución de la sociedad.","8.2. El ejercicio del derecho de admisión podrá efectuarse sin previo aviso, sin necesidad de motivación y sin que el interesado tenga derecho a indemnización, compensación o disculpa alguna, sin perjuicio de la devolución de las cantidades abonadas, que se efectuará, en su caso, a la mayor brevedad posible y sin ningún tipo de contacto visual.","8.3. Se exceptúa del régimen anterior a D. Jacob Black, a quien se reconoce la condición de vigilante externo con acceso ocasional los viernes por la noche a efectos de aullido ceremonial. Dicha excepción reviste carácter personalísimo, no sienta precedente, no genera derecho de analogía y podrá ser revocada sin previo aviso en caso de deterioro de las relaciones bilaterales.","8.4. La decisión de admisión corresponderá en exclusiva al fundador, que la adoptará previa consulta con D.ª Alice Cullen, quien declara conocer de antemano el resultado, razón por la cual la consulta será meramente formal."]},{id:"9",label:"NOVENA",title:"Servicios, configurador y presupuestos",paras:["9.1. El configurador interactivo disponible en el sitio web tiene carácter meramente orientativo y no constituye oferta contractual vinculante, presupuesto cerrado ni compromiso de contratación, hallándose sujeto en todo caso a la revisión, validación y eventual modificación por parte del fundador a la luz de las velas.","9.2. La solicitud de presupuesto a través del sitio web no genera obligación alguna para ninguna de las partes, salvo la de LA FUNERARIA de contactar con el solicitante en un plazo aproximado de dos (2) horas, plazo que podrá verse ampliado cuando concurran circunstancias de especial dificultad, como lluvia, tráfico, ceremonia simultánea, visión inoportuna de D.ª Alice Cullen o crisis de personal.","9.3. Las menciones a la intervención personal de determinados miembros del equipo (en particular, la interpretación pianística de D. Edward Cullen, el diseño floral de D.ª Esme Cullen o el porte de féretros por D. Emmett Cullen) lo son a título informativo, pudiendo LA FUNERARIA sustituir a los profesionales mencionados por otros de igual o similar capacidad sin que ello genere derecho a minoración del precio ni a resarcimiento alguno.","9.4. LA FUNERARIA no garantiza la disponibilidad de las trescientas (300) velas anunciadas en la modalidad Nocturna Signature en caso de desabastecimiento, prohibición administrativa o disposición de la comunidad de vecinos, pudiendo en tal caso sustituirlas por cualquier número de velas que, a su juicio, procure un ambiente razonablemente equivalente."]},{id:"10",label:"DÉCIMA",title:"Precios, forma de pago y financiación",paras:["10.1. Los precios indicados en el sitio web incluyen el Impuesto sobre el Valor Añadido al tipo vigente, salvo error tipográfico, variación normativa o circunstancia sobrevenida, y se entenderán siempre «orientativos para Madrid y Forks», hallándose los de Volterra y repatriaciones sujetos a consulta.","10.2. La financiación en veinticuatro (24) mensualidades «sin intereses» se halla sujeta a estudio de solvencia, aprobación discrecional y, según se indica en el sitio web, «a una sonrisa», entendiéndose por tal la que el solicitante exhiba, en persona y a satisfacción del fundador, durante un período no inferior a tres (3) segundos.","10.3. El impago de cualquiera de las cuotas facultará a LA FUNERARIA para dar por vencida la totalidad de la deuda y para requerir su pago a través de la Correduría de Seguros Drácula, cuya intervención se extiende, por razones de coherencia corporativa, a la gestión de cobros.","10.4. Las promociones, descuentos y bonificaciones entre sociedades hermanas, incluida la reducción del quince por ciento (15 %) aplicable a clientes de LA FUNERARIA en la Correduría de Seguros Drácula, no son acumulables entre sí, no son transferibles, no son canjeables por dinero y no resultan exigibles en caso de resurrección del cliente."]},{id:"11",label:"UNDÉCIMA",title:"Desistimiento, cancelación y modificación del servicio",paras:["11.1. Dada la naturaleza personalísima, perentoria y no repetible de los servicios funerarios, y de conformidad con la normativa vigente en materia de servicios plenamente ejecutados a petición del consumidor, no se reconoce derecho de desistimiento una vez iniciada la prestación del servicio.","11.2. El difunto, titular último del servicio, no ha manifestado en ningún caso su intención de desistir, extremo que se tendrá por acreditado a todos los efectos, salvo prueba en contrario por parte de quien invoque el desistimiento, prueba que deberá aportarse en el plazo de veinticuatro (24) horas y por el propio difunto.","11.3. Las modificaciones del servicio solicitadas con posterioridad a la confirmación del presupuesto podrán dar lugar a la aplicación de recargos por rediseño floral, repetición de ensayo musical, retraso del chocolate caliente de las dos de la madrugada y cualesquiera otros que resulten procedentes."]},{id:"12",label:"DUODÉCIMA",title:"Limitación de responsabilidad",paras:["12.1. LA FUNERARIA no será responsable de los daños y perjuicios que, directa o indirectamente, se deriven del uso del sitio web, de la contratación de sus servicios o de la mera proximidad a sus profesionales, salvo en los supuestos en que la normativa imperativa disponga lo contrario y con el límite máximo del importe efectivamente abonado por el usuario en los últimos doce (12) meses.","12.2. Sin carácter limitativo, quedan excluidos de responsabilidad: la exposición solar de las Personas Afectadas durante los traslados, que se realizarán con factor de protección SPF 50 y no con garantía de brillo; la aparición de reflejos inesperados en superficies pulidas; el contacto accidental con ajo en el catering (alioli incluido); y las resurrecciones espontáneas, parciales o totales, de los difuntos objeto del servicio.","12.3. En caso de resurrección espontánea del difunto durante el servicio, LA FUNERARIA no asumirá responsabilidad alguna, sin perjuicio de su compromiso de ofrecer un café al resucitado y de informar a la Correduría de Seguros Drácula a efectos de reclasificación de la póliza.","12.4. El usuario mantendrá indemne a LA FUNERARIA, a sus administradores, socios, empleados y colaboradores, así como a los miembros del Círculo y a sus respectivos linajes, frente a cualquier reclamación de terceros derivada de un incumplimiento por su parte de este Texto, incluidas las derivadas de cualquier Reproche, con renuncia expresa a cualquier fuero propio."]},{id:"13",label:"DECIMOTERCERA",title:"Propiedad intelectual, imágenes y semejanzas",paras:["13.1. Todos los contenidos del sitio web, incluidos textos, diseños, marcas, logotipos, estructuras, código fuente, animaciones, nombres de personajes y el gesto de encender una vela, son titularidad de LA FUNERARIA o de terceros que han autorizado su uso, quedando prohibida su reproducción, distribución, comunicación pública o transformación sin autorización expresa y por escrito.","13.2. Algunas de las imágenes que ilustran el sitio han sido generadas mediante sistemas de inteligencia artificial y no representan a personas reales, vivas, fallecidas o no muertas. Cualquier semejanza con el Dr. Carlisle Cullen, real o aparente, es producto de la inspiración estética del sistema generador.","13.3. El sitio web hace referencia a personajes y obras de ficción pertenecientes a terceros, con fines paródicos, humorísticos y sin ánimo de lucro respecto de dichas obras, sin que ello implique relación, patrocinio, aprobación ni conocimiento de sus legítimos titulares.","13.4. Los nombres de personajes utilizados en el equipo, entre otros «Cullen», «Hale» o «Black», lo son a título de coincidencia onomástica y no suponen afirmación de identidad entre las personas físicas aquí mencionadas y los personajes de la novela homónima, extremo este que las Personas Afectadas negarán en todo caso en juicio."]},{id:"14",label:"DECIMOCUARTA",title:"Protección de datos de carácter personal",paras:["14.1. De conformidad con el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016 (RGPD), y la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, se informa al usuario de que LA FUNERARIA es responsable del tratamiento de los datos personales que este facilite a través de los formularios del sitio web, del teléfono de urgencias o de cualquier otro canal.","14.2. Los datos serán tratados con la finalidad de atender las solicitudes de información y presupuesto, gestionar la contratación y prestación de los servicios, remitir comunicaciones relacionadas con los mismos, y comunicar los datos de los clientes de LA FUNERARIA a las sociedades hermanas del Círculo a efectos de aplicar bonificaciones recíprocas, y, en su caso, para dedicar una vela a nombre del usuario.","14.3. La base jurídica del tratamiento será la ejecución de medidas precontractuales y contractuales, el interés legítimo de LA FUNERARIA en la prestación de un servicio ininterrumpido y, de forma complementaria, el consentimiento que el usuario presta mediante el envío del formulario.","14.4. Los datos se conservarán durante el tiempo necesario para cumplir con las finalidades indicadas y, posteriormente, durante los plazos legalmente exigibles y, en defecto de estos, de forma indefinida, por razones evidentes de longevidad institucional.","14.5. El usuario podrá ejercitar sus derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad mediante comunicación escrita dirigida a la dirección de correo electrónico indicada en el encabezamiento. El derecho de supresión no alcanzará a los datos que, según la valoración de D.ª Alice Cullen, vayan a ser solicitados de nuevo por el usuario en un plazo razonable.","14.6. Los datos no serán objeto de transferencia internacional, salvo cuando se trate de repatriaciones a Volterra, Forks o cualquier otro destino en el que se hallen las familias o los difuntos, ni de cesión a terceros, salvo a las sociedades del Círculo y a las autoridades que legalmente corresponda. Se garantiza la confidencialidad absoluta de los datos, que no serán objeto de lectura mental por parte de D. Edward Cullen salvo consentimiento expreso del interesado."]},{id:"15",label:"DECIMOQUINTA",title:"Política de cookies y dispositivos de almacenamiento",paras:["15.1. Este sitio web no utiliza cookies de seguimiento, publicidad comportamental ni elaboración de perfiles. Esta ausencia obedece a razones técnicas y no a la voluntad de las Personas Afectadas de no conocer los hábitos nocturnos del usuario, que ya conocen.","15.2. En la medida en que el sitio emplee cookies estrictamente técnicas, estas no requerirán consentimiento y se almacenarán únicamente durante la sesión del usuario, desapareciendo al cierre del navegador con la rapidez característica de las apariciones en la niebla.","15.3. Las galletas que se ofrezcan en los eventos presenciales carecen de ajo."]},{id:"16",label:"DECIMOSEXTA",title:"Círculo de Ex-Vampiros, páginas hermanas y enlaces",paras:["16.1. El sitio web incluye enlaces a las páginas de las sociedades hermanas del Círculo, a saber, la Correduría de Seguros Drácula, la Guardería Barlow · Dientes de Leche, el Centro de Bienestar Carmilla y la Firma de la Casa (D. Strahd von Zarovich), cada una de las cuales es independiente, tiene su propia personalidad jurídica o, en su defecto, castillo, y se rige por sus propios textos legales, de los que LA FUNERARIA no responde.","16.2. Los contenidos publicitarios de las sociedades hermanas pueden haber sido sometidos a corrección ortotipográfica, de estilo o de tono por parte de D.ª Esme Cullen, sin que dicha intervención implique aprobación, revisión de legalidad ni conformidad alguna con su veracidad, exhaustividad o adecuación al ordenamiento aplicable.","16.3. En particular, la denominación «Mircalla S.L.» que figura en el concepto de facturación del Centro de Bienestar Carmilla responde a las preferencias de dicha sociedad y no supone afirmación alguna por parte de LA FUNERARIA acerca de la naturaleza o legalidad de las prestaciones concretas, que se declaran absolutamente respetables y de las que LA FUNERARIA no ha querido saber más.","16.4. La solicitud de ingreso en el Círculo formulada por D. Orlok, conocido como «Nosferatu», titular de la Clínica de Cirugía Estética Orlok (Expediente 1922), ha sido denegada por la junta con base en las razones expuestas en el sitio web, a saber: la reclamación de plagio planteada por la Correduría de Seguros Drácula, la presencia de un número desmesurado de prótesis, la incertidumbre sobre su naturaleza (vampírica o pestilente) y el volumen de reseñas negativas recibidas por su clínica.","16.5. La denegación indicada no constituye Reproche, discriminación ni acto contrario a la Cláusula Séptima, por tratarse del ejercicio legítimo de la facultad de admisión del Círculo y no de una recriminación sobre la Condición de D. Orlok, la cual, de hecho, no es objeto de debate. El interesado podrá reiterar su solicitud cuando concurran las condiciones previstas en el sitio web, sin que ello implique compromiso de admisión.","16.6. Se incorpora al Círculo, con carácter provisional y bajo condición resolutoria, la Firma de la Casa, regentada por D. Strahd von Zarovich, cuya actividad consiste en la publicación de narrativa romántica de altas pasiones. Dicha incorporación se halla subordinada a las negociaciones en curso con las entidades oscuras de Barovia, de las que depende la autorización de salida del interesado de su territorio, así como a las conversaciones mantenidas con D. Vecna en relación con la eventual ejecución de su exploit, cuya viabilidad técnica no se garantiza, no se descarta y no es objeto de pronunciamiento por parte de LA FUNERARIA.","16.6 bis. A los efectos meramente descriptivos del apartado anterior, y sin que suponga reconocimiento alguno de eficacia, se denomina «exploit» la maniobra atribuida a D. Vecna consistente en: (i) abandonar el plano propio; (ii) hacerlo en condición de divinidad incompleta, esto es, con la apariencia y las facultades suficientes para atravesar la niebla pero sin alcanzar la plenitud divina, por ser esta última incompatible con la supervivencia del interesado ante la autoridad competente de la Ciudad de las Puertas, conocida coloquialmente como «la doña» y, en los foros, como la Dama del Dolor, quien no admite divinidades en su término municipal; y (iii) acceder a dicha ciudad sin perecer en el intento. LA FUNERARIA no ha verificado este procedimiento, no lo recomienda, no lo ha probado y no dispone de personal con la formación necesaria para explicarlo dos veces seguidas.","16.7. La circunstancia de que la totalidad de las protagonistas de las obras de D. Strahd von Zarovich reciban el nombre de «Tatiana» responde, según manifiesta el autor, a una decisión de estilo editorial denominada «firma de la casa», de carácter deliberado, artístico y no discriminatorio, y en ningún caso a una limitación creativa, a una confusión, a un olvido o a la existencia de una única persona real, extremo este sobre el que la junta ha deliberado suficientemente y no desea volver a pronunciarse.","16.8. Los contenidos literarios publicados por la Firma de la Casa son responsabilidad exclusiva de su autor y se dirigen a un público adulto. LA FUNERARIA no los revisa, no los recomienda, no los distribuye y, en rigor, no consta que los haya leído, aunque D.ª Esme Cullen haya corregido las comas."]},{id:"17",label:"DECIMOSÉPTIMA",title:"Reseñas, opiniones y testimonios",paras:["17.1. Los testimonios, reseñas y opiniones publicados en el sitio web corresponden a la experiencia subjetiva de los usuarios que los emitieron y han sido seleccionados por LA FUNERARIA con criterio estrictamente discrecional y sin obligación de equilibrio, representatividad ni proporcionalidad.","17.2. Las reseñas negativas que pudieran dirigirse a LA FUNERARIA en plataformas de terceros serán examinadas con detenimiento por el fundador y, de apreciarse en ellas el más mínimo Reproche, serán puestas en conocimiento de la Correduría de Seguros Drácula a los efectos oportunos."]},{id:"18",label:"DECIMOCTAVA",title:"Comunicaciones y notificaciones",paras:["18.1. Las comunicaciones entre las partes se realizarán por escrito, mediante correo electrónico a la dirección que figura en el encabezamiento, carta certificada con acuse de recibo o burofax con certificación de contenido, dirigidos al domicilio social de LA FUNERARIA o al que esta señale a tal efecto.","18.2. No tendrán validez a efectos de notificación las comunicaciones realizadas mediante murciélago, niebla, apariciones, sueños, mensajes en espejos, señales con velas, aullidos, cuervos u otros medios de naturaleza esotérica, sin perjuicio de la eficacia que estos pudieran tener entre las Personas Afectadas y entre estas y el fundador.","18.3. Las notificaciones dirigidas al usuario se entenderán válidamente efectuadas cuando se remitan al teléfono, correo electrónico o domicilio facilitado, incluso si el usuario no las recibe por encontrarse fallecido."]},{id:"19",label:"DECIMONOVENA",title:"Fuerza mayor y caso fortuito",paras:["19.1. Ninguna de las partes será responsable del incumplimiento o cumplimiento defectuoso de sus obligaciones cuando este se deba a causas de fuerza mayor o caso fortuito, entendiéndose por tales aquellas que no hubieran podido preverse o que, previstas, fueran inevitables, con independencia de que la previsión se halle en manos de D.ª Alice Cullen.","19.2. Tendrán, entre otras, la consideración de fuerza mayor: las condiciones atmosféricas de insolación excepcional; las nevadas, nieblas o lluvias de intensidad extraordinaria; las huelgas generales de pompas fúnebres, floristas o pianistas; las actuaciones de la autoridad; la irrupción de una turba con antorchas y horquillas; y las reclamaciones, conflictos o disputas heredados de ciclos anteriores de la existencia."]},{id:"20",label:"VIGÉSIMA",title:"Modificación del Texto",paras:["20.1. LA FUNERARIA podrá modificar el presente Texto en cualquier momento, sin previo aviso, con efectos retroactivos desde la fecha de constitución de la sociedad y, a mayor abundamiento, desde la de nacimiento de sus socios. Se recomienda al usuario revisar periódicamente su contenido, lo que podrá hacer cuantas veces desee en la ubicación señalada en la Cláusula Primera.","20.2. El uso continuado del sitio web o la contratación de los servicios tras la publicación de cualquier modificación implicará la aceptación de esta en su integridad."]},{id:"21",label:"VIGESIMOPRIMERA",title:"Nulidad parcial, integridad y renuncias",paras:["21.1. Si alguna de las cláusulas del presente Texto fuera declarada nula o inaplicable por un órgano judicial o administrativo competente, la nulidad o inaplicabilidad afectará únicamente a dicha cláusula, la cual se entenderá sustituida por otra de contenido lo más próximo posible, y manteniéndose en vigor las restantes en toda su extensión. A los efectos de este apartado, se presumirá siempre que la cláusula nula es la que menos interesa a las Personas Afectadas.","21.2. El presente Texto constituye el acuerdo íntegro entre las partes y sustituye a cualquier otro anterior, verbal o escrito, relativo a su objeto, con la salvedad de lo que se dijo en el sitio web con una tipografía de mayor tamaño y que, por ser más atractivo, el usuario recordará con mayor facilidad.","21.3. La falta de ejercicio por LA FUNERARIA de cualquiera de los derechos que este Texto le reconoce no supondrá renuncia a los mismos, que podrán ser ejercitados en cualquier momento, incluso transcurridos varios siglos."]},{id:"22",label:"VIGESIMOSEGUNDA",title:"Legislación aplicable, jurisdicción y arbitraje",paras:["22.1. El presente Texto se regirá e interpretará con arreglo a la legislación española, con carácter supletorio la del Estado de Washington en lo que respecta a las actividades desarrolladas en Forks, y con carácter subsidiario el derecho consuetudinario de la ciudad de Volterra, al que las partes se someten de forma voluntaria y plena.","22.2. Para la resolución de cuantas controversias pudieran derivarse del mismo, las partes, con renuncia expresa a cualquier otro fuero que pudiera corresponderles, se someten a los Juzgados y Tribunales de la ciudad de Madrid. Cuando el usuario ostente la condición de consumidor, será competente el tribunal de su domicilio, salvo que se trate de un Reproche, supuesto en el cual lo será el de Madrid o, a elección de la parte promotora, cualquier otro, incluso en horario nocturno.","22.3. Las controversias relativas a la interpretación de la Condición, la Estirpe o la distinción entre ser, estar e identificarse se someterán, con carácter previo y obligatorio, al arbitraje del Consejo de Volterra, cuyo laudo será definitivo, vinculante e inapelable, salvo que sea apelado."]}],M8=[{label:"Disposición adicional primera",text:"Se entenderá que el usuario que haya leído el presente Texto hasta este punto ha prestado su consentimiento informado a todo lo en él contenido y, además, merece un agradecimiento sincero y una cita, sin compromiso, con D.ª Esme Cullen para tomar un café, que deberá ser organizado por el propio usuario."},{label:"Disposición adicional segunda",text:"La existencia del presente Texto no podrá ser invocada por el usuario como prueba de que las Personas Afectadas ocultan información, por cuanto este ha sido publicado, en todo momento, en un lugar accesible del sitio web, aunque no se haya considerado necesario destacarlo."},{label:"Disposición transitoria única",text:"Los servicios contratados con anterioridad a la entrada en vigor de la Versión 13.1 se regirán por las versiones 1 a 13.0, cuyo contenido no se halla actualmente disponible por haber sido consumido, parcialmente, por un incendio en 1922 y por la humedad de los sótanos de Wisborg."},{label:"Disposición derogatoria",text:"Quedan derogadas cuantas disposiciones, normas, usos, costumbres y leyendas de igual o inferior rango se opongan a lo dispuesto en el presente Texto, y en particular las que atribuyan a las Personas Afectadas debilidades, aversiones o limitaciones de cualquier naturaleza."},{label:"Disposición final",text:"El presente Texto entrará en vigor el mismo día de su publicación y permanecerá vigente por tiempo indefinido y, a ser posible, eterno."}],z8="Y en prueba de conformidad, y para que conste a los efectos oportunos, las partes comparecientes otorgan el presente Texto refundido en el lugar y fecha arriba indicados, en un solo ejemplar original y tantas copias como sean necesarias, firmando al pie las Personas Afectadas, el mediador de seguros que asume su defensa y la persona encargada de la corrección ortotipográfica.",D8=[{name:"D. Carlisle Cullen",role:"Fundador y administrador único"},{name:"D. Vlad Drácula",role:"Correduría de Seguros Drácula · En su calidad de defensor"},{name:"D.ª Esme Cullen",role:"Corrección ortotipográfica"}];function R8(n){document.getElementById(`clausula-${n}`)?.scrollIntoView({behavior:"smooth",block:"start"})}function k8(){const[n,s]=B.useState("1");return B.useEffect(()=>{const o=new IntersectionObserver
